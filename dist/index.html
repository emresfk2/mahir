<html lang="tr">

<meta name="description" content="Mahir: usta ve ev hizmetlerinde tek muhatap. Demo web uygulaması.">
<title>Mahir · usta ve hizmet platformu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22Mahir%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214.4%22%20fill%3D%22%2314493F%22/%3E%3Cg%20transform%3D%22translate%2815.89%2018.57%29%20scale%280.2685%29%22%3E%3Cline%20x1%3D%22120.00%22%20y1%3D%220.00%22%20x2%3D%22120.00%22%20y2%3D%22100.00%22%20stroke%3D%22%23E39A0B%22%20stroke-width%3D%2223.0%22%20stroke-linecap%3D%22round%22/%3E%3Cline%20x1%3D%2260.00%22%20y1%3D%2280.00%22%20x2%3D%22120.00%22%20y2%3D%220.00%22%20stroke%3D%22%23F7B51C%22%20stroke-width%3D%2223.0%22%20stroke-linecap%3D%22round%22/%3E%3Cline%20x1%3D%220.00%22%20y1%3D%220.00%22%20x2%3D%2260.00%22%20y2%3D%2280.00%22%20stroke%3D%22%23E39A0B%22%20stroke-width%3D%2223.0%22%20stroke-linecap%3D%22round%22/%3E%3Cline%20x1%3D%220.00%22%20y1%3D%22100.00%22%20x2%3D%220.00%22%20y2%3D%220.00%22%20stroke%3D%22%23F7B51C%22%20stroke-width%3D%2223.0%22%20stroke-linecap%3D%22round%22/%3E%3C/g%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
/* ===== Mahir · görünüm =====
   Çam yeşili, kâğıt beyazı ve metre sarısı. Sarı yalnızca “sıra sende” ve ana eylem için kullanılır;
   katlanır metrenin çentikleri başlıkta, yolculuk çizgisinde ve ölçü çizimlerinde tekrar eder. */
:root {
  --pine: #14493F; --ink-sabit: #0D2B26; --sari: #F7B51C; --amber: #E39A0B; --kagit: #F3F5F0;
  --bg: #F3F5F0; --yuzey: #FFFFFF; --yuzey-2: #E9EDE5; --ink: #0D2B26; --ink-2: #4A615B; --ink-3: #74867F; --line: #D7DED3;
  --vurgu: #14493F; --vurgu-soluk: #E0EAE4; --koyu-kart: #0D2B26; --logo-kare: #14493F; --logo-nokta: #E39A0B;
  --tamam: #1B7550; --tamam-bg: #DCEFE4; --sorun: #B03626; --sorun-bg: #F8E2DD; --bekle: #44565F; --bekle-bg: #E4E9EA; --sen: #563F00; --sen-bg: #FFE7A0;
  --golge: 0 1px 2px rgba(13, 43, 38, .05), 0 8px 22px rgba(13, 43, 38, .07);
  --yazi: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1D19; --yuzey: #112B26; --yuzey-2: #19392F; --ink: #EEF2EA; --ink-2: #A9BCB5; --ink-3: #7F958D; --line: #26463E;
    --vurgu: #F7B51C; --vurgu-soluk: #1C3F37; --koyu-kart: #1B5E52; --logo-kare: #1B5E52; --logo-nokta: #F7B51C;
    --tamam: #74D6A6; --tamam-bg: #163D2F; --sorun: #FF9F90; --sorun-bg: #4B221C; --bekle: #B6C8C5; --bekle-bg: #1F3C3A; --sen: #FFE08A; --sen-bg: #574307;
    --golge: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1D19; --yuzey: #112B26; --yuzey-2: #19392F; --ink: #EEF2EA; --ink-2: #A9BCB5; --ink-3: #7F958D; --line: #26463E;
  --vurgu: #F7B51C; --vurgu-soluk: #1C3F37; --koyu-kart: #1B5E52; --logo-kare: #1B5E52; --logo-nokta: #F7B51C;
  --tamam: #74D6A6; --tamam-bg: #163D2F; --sorun: #FF9F90; --sorun-bg: #4B221C; --bekle: #B6C8C5; --bekle-bg: #1F3C3A; --sen: #FFE08A; --sen-bg: #574307;
  --golge: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .28);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--yazi); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { cursor: not-allowed; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.ik { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ik.dolu { fill: var(--sari); stroke: var(--amber); }
.ik.ok { color: var(--ink-3); margin-left: auto; }
.ik.ok-yesil { color: var(--tamam); }
.para, dd, .tahmin, time, output, code { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- çatı ---------- */
#app { height: 100%; display: flex; flex-direction: column; }
.demo { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 12px; background: var(--ink-sabit); color: var(--kagit); flex: none; }
.demo-et { display: flex; align-items: center; gap: 8px; min-width: 0; }
.demo-et b { font: 500 11px/1 var(--mono); letter-spacing: .08em; background: var(--sari); color: var(--ink-sabit); padding: 4px 6px; border-radius: 4px; }
.demo-et i { font-style: normal; font-size: 12px; opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-et u { text-decoration: none; }
.rol { display: flex; background: rgba(255, 255, 255, .12); border-radius: 999px; padding: 2px; flex: none; }
.rol button { border: 0; background: none; color: inherit; font: 500 13px var(--yazi); padding: 6px 11px; border-radius: 999px; min-height: 32px; }
.rol button.sec { background: var(--kagit); color: var(--ink-sabit); }
.bas { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 15px; flex: none; position: relative; }
.bas::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 9px; opacity: .9;
  background: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 50px) left bottom / 100% 9px no-repeat,
              repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10px) left bottom / 100% 5px no-repeat; }
.logo { border: 0; background: none; padding: 0; display: flex; align-items: center; color: var(--ink); border-radius: 8px; }
.lg { height: 32px; width: auto; display: block; }
.lg-kare { fill: var(--logo-kare); } .lg-yazi { fill: currentColor; } .lg-nokta { fill: var(--logo-nokta); }
.baglam { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--yuzey); color: var(--ink); border-radius: 999px; padding: 7px 10px; font: 500 14px var(--yazi); min-width: 0; max-width: 62%; min-height: 38px; }
.baglam span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.baglam .ik { width: 16px; height: 16px; color: var(--ink-2); }
.baglam.sabit { border-style: dashed; color: var(--ink-2); }

.govde { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.orta { flex: 1; min-height: 0; display: flex; flex-direction: column; order: 1; }
#icerik { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; outline: none; }
.sayfa { max-width: 680px; margin: 0 auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 12px; }
.sekme { order: 2; display: flex; background: var(--yuzey); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); flex: none; }
.sekme button { flex: 1; border: 0; background: none; color: var(--ink-3); font: 500 11px var(--yazi); padding: 9px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; min-height: 56px; }
.sekme button.sec { color: var(--ink); }
.sekme button.sec::before { content: ''; position: absolute; top: -1px; left: 50%; width: 30px; height: 3px; margin-left: -15px; background: var(--sari); border-radius: 0 0 3px 3px; }
.sekme .sayi { position: absolute; top: 5px; left: 50%; margin-left: 5px; }
.sayi { font: 500 10px/1 var(--mono); font-style: normal; background: var(--sari); color: var(--ink-sabit); border-radius: 999px; min-width: 17px; height: 17px; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px; }

.rehber { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-top: 1px solid var(--line); background: var(--yuzey); color: var(--ink); text-align: left; padding: 8px 12px 8px 16px; box-shadow: inset 5px 0 0 var(--sari); flex: none; min-height: 52px; }
.rehber-et { font: 500 10px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); width: 62px; flex: none; }
.rehber-metin { flex: 1; min-width: 0; font-size: 14px; line-height: 1.3; }
.rehber-metin small { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- yazı ve ortak parçalar ---------- */
.baslik { font: 700 26px/1.15 var(--yazi); letter-spacing: -.02em; margin-top: 4px; }
.bolum { font: 500 12px/1 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); margin: 12px 0 0; display: flex; align-items: center; gap: 10px; }
.bolum::after { content: ''; flex: 1; height: 5px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 8px); }
.giris { color: var(--ink-2); }
.dipnot { font-size: 12px; color: var(--ink-3); text-align: center; }
.ipucu { font-size: 13px; color: var(--ink-3); margin-top: 8px; }
.hata { font-size: 13px; color: var(--sorun); font-weight: 500; margin-top: 8px; }
.sayfa-bas { display: flex; align-items: center; gap: 10px; }
.sayfa-bas h1 { font: 700 20px/1.2 var(--yazi); letter-spacing: -.01em; }
.sayfa-bas p { font-size: 13px; color: var(--ink-2); }
.geri { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--yuzey); display: flex; align-items: center; justify-content: center; flex: none; }
.durum-satir { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }

.kart { background: var(--yuzey); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.kart h2 { font: 600 16px/1.3 var(--yazi); margin-bottom: 10px; }
.kart h2 small { font-weight: 400; color: var(--ink-3); font-size: 13px; }
.kart h3 { font: 600 13px/1.3 var(--yazi); color: var(--ink-2); margin: 14px 0 8px; }
.kart h3 i, .alan span i { font-style: normal; font-weight: 400; color: var(--ink-3); margin-left: 4px; }
.kart > p { color: var(--ink-2); margin-bottom: 10px; }
.kart > p:last-child { margin-bottom: 0; }
.kart > p b { color: var(--ink); }
.kart > .btn { margin-top: 12px; }
.kart-ust { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.kart-ust h2 { margin: 0; }
button.kart { text-align: left; width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
button.kart:active, .kat:active, .acil-kart:active { transform: scale(.99); }
.liste { display: flex; flex-direction: column; gap: 8px; }
.liste.soluk { opacity: .55; }
.rozet { width: 42px; height: 42px; border-radius: 12px; background: var(--vurgu-soluk); color: var(--vurgu); display: flex; align-items: center; justify-content: center; flex: none; }
.rozet .ik { width: 22px; height: 22px; }
.rozet.buyuk { width: 52px; height: 52px; border-radius: 15px; }
.eylem { border-color: var(--sari); box-shadow: inset 0 5px 0 var(--sari); padding-top: 20px; }
.eylem.bekle { border-color: var(--line); box-shadow: inset 0 5px 0 var(--line); }
.eylem.tamam { border-color: var(--tamam); box-shadow: inset 0 5px 0 var(--tamam); }
.eylem.kapali { border-color: var(--line); box-shadow: inset 0 5px 0 var(--ink-3); }
.dikkat { border-color: var(--sari); box-shadow: inset 5px 0 0 var(--sari); }

.cip { font: 500 12px/1.2 var(--yazi); padding: 4px 9px; border-radius: 999px; white-space: nowrap; display: inline-block; background: var(--bekle-bg); color: var(--bekle); }
.cip-sen { background: var(--sen-bg); color: var(--sen); }
.cip-aktif { background: var(--vurgu-soluk); color: var(--ink); }
.cip-tamam { background: var(--tamam-bg); color: var(--tamam); }
.cip-sorun { background: var(--sorun-bg); color: var(--sorun); }
.cip-kapali { background: var(--yuzey-2); color: var(--ink-2); }

.sip-orta, .hiz-orta { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.sip-orta b, .hiz-orta b { font-weight: 600; line-height: 1.25; }
.sip-orta small, .hiz-orta small { font-size: 13px; color: var(--ink-2); }
.sip-alt { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.sip-alt .para { font-size: 14px; color: var(--ink); }
.hiz-alt { display: flex; gap: 10px; align-items: baseline; margin-top: 3px; font-size: 13px; }
.hiz-alt em { font: 500 13px var(--mono); font-style: normal; color: var(--ink); }
.hiz-alt i { font-style: normal; color: var(--ink-3); }

.kalemler > div { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.kalemler > div:last-child { border-bottom: 0; }
.kalemler dt { color: var(--ink-2); font-size: 14px; }
.kalemler dt small { color: var(--ink-3); font-size: 12px; }
.kalemler dd { font-size: 14px; text-align: right; white-space: nowrap; }
.kalemler .toplam { border-top: 1.5px solid var(--ink); border-bottom: 0; margin-top: 2px; padding-top: 9px; }
.kalemler .toplam dt { color: var(--ink); font-weight: 600; font-size: 15px; }
.kalemler .toplam dd { font-size: 18px; font-weight: 500; }
.kalemler.bilgi dd, .kalemler.uzun dd { white-space: normal; font-family: var(--yazi); max-width: 62%; }
.kalemler.bilgi dt { flex: none; }
.kalemler.mini dt, .kalemler.mini dd { font-size: 13px; }
.kalemler.mini > div { padding: 4px 0; }
.para-durum { margin-top: 10px; background: var(--yuzey-2); border-radius: 12px; padding: 4px 12px; }
dd.eksi { color: var(--sorun); } dd.arti { color: var(--tamam); }

.not { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.4; color: var(--ink-2); background: var(--yuzey-2); border-radius: 11px; padding: 9px 11px; margin-top: 10px; }
.not .ik { width: 16px; height: 16px; margin-top: 1px; }
.not-uyari { background: var(--sorun-bg); color: var(--sorun); }
.sayfa > .not { margin-top: 0; }
.bos { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; color: var(--ink-3); border: 1.5px dashed var(--line); border-radius: 16px; padding: 26px 18px; font-size: 14px; }
.bos .ik { width: 26px; height: 26px; }
.alinti { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; color: var(--ink) !important; font-size: 15px; }
.alinti.usta { border-color: var(--sari); }
.karar { display: flex; gap: 8px; background: var(--tamam-bg); color: var(--ink) !important; border-radius: 11px; padding: 10px 11px; font-size: 14px; }
.karar .ik { color: var(--tamam); margin-top: 1px; }
.karar small { color: var(--ink-2); }

/* ---------- düğmeler ve form ---------- */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: var(--sari); color: var(--ink-sabit); font: 600 16px/1.2 var(--yazi); padding: 12px 16px; text-align: center; }
.btn:active { filter: brightness(.95); }
.btn:disabled { opacity: .42; }
.btn small { font: 500 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.btn.ikincil { background: transparent; border: 1.5px solid var(--line); color: var(--ink); font-weight: 500; }
.btn.tehlike { background: #B03626; color: #fff; }
.btn.ikincil.tehlike, .btn.metin.tehlike { background: transparent; color: var(--sorun); }
.btn.metin { background: none; min-height: 42px; color: var(--ink-2); font-weight: 500; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
.btn.kucuk { width: auto; min-height: 36px; font-size: 14px; padding: 6px 12px; border-radius: 11px; flex: none; }
.btn-sira { display: flex; gap: 8px; margin-top: 12px; }
.btn-sira .btn { flex: 1; margin: 0; }
.btn-sira.tek:empty { display: none; }
.ikon-btn { width: 46px; height: 46px; border-radius: 13px; border: 0; background: var(--sari); color: var(--ink-sabit); display: flex; align-items: center; justify-content: center; flex: none; }
.alt-cubuk { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 4px; padding: 14px 0 6px; margin-top: -4px; background: linear-gradient(to bottom, transparent, var(--bg) 26%); z-index: 2; }
.islemler { display: flex; flex-direction: column; gap: 8px; }

.alan { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
.alan:first-child { margin-top: 0; }
.alan > span:first-child { font-size: 13px; font-weight: 500; color: var(--ink-2); }
input[type="text"], input[type="number"], textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--yuzey); padding: 12px; font-size: 16px; min-height: 48px; }
textarea { resize: vertical; line-height: 1.4; }
input:focus, textarea:focus { outline: none; border-color: var(--vurgu); box-shadow: 0 0 0 3px var(--vurgu-soluk); }
.alan.yan { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.birimli { display: flex; align-items: center; gap: 8px; }
.birimli input { width: 110px; text-align: right; font-family: var(--mono); }
.birimli i { font-style: normal; color: var(--ink-2); font-size: 14px; width: 26px; }
.cipler, .dilim { display: flex; flex-wrap: wrap; gap: 8px; }
.cp { border: 1.5px solid var(--line); background: var(--yuzey); border-radius: 999px; padding: 9px 14px; font: 500 14px var(--yazi); min-height: 42px; display: inline-flex; align-items: center; gap: 6px; }
.cp.sec { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.sayac { display: flex; align-items: center; gap: 14px; }
.sayac button { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--yuzey); display: flex; align-items: center; justify-content: center; }
.sayac button:disabled { opacity: .35; }
.sayac output { font-size: 22px; font-weight: 500; min-width: 86px; text-align: center; }
.sayac output small { font: 400 14px var(--yazi); color: var(--ink-2); }
.gunler { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.gunler::-webkit-scrollbar, .hazir::-webkit-scrollbar { display: none; }
.gunler button { flex: none; width: 58px; border: 1.5px solid var(--line); background: var(--yuzey); border-radius: 14px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.gunler small { font-size: 11px; color: var(--ink-2); }
.gunler b { font: 500 20px/1.1 var(--mono); }
.gunler .sec, .saatler .sec { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.gunler .sec small, .saatler .sec small { color: inherit; opacity: .8; }
.saatler { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.saatler button { border: 1.5px solid var(--line); background: var(--yuzey); border-radius: 12px; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.saatler b { font: 500 15px var(--mono); }
.saatler small { font: 500 11px var(--mono); color: var(--amber); }
.secim-liste { display: flex; flex-direction: column; gap: 8px; }
.secim-liste button { text-align: left; border: 1.5px solid var(--line); background: var(--yuzey); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.secim-liste span { font-weight: 600; }

/* ===== Mahir · iş kuralları =====
   Sipariş durum makinesi, fiyatlama, bloke ödeme defteri, şikâyet kararları.
   Tarayıcıdan bağımsızdır; gerçek bir sunucuya taşınırken bu dosya API katmanının arkasına geçer. */

const SAAT = 3600e3, GUN = 24 * SAAT, DK = 60e3;
const SURUM = 5;
const ANAHTAR = 'mahir-demo';

/* Tasarım dokümanındaki oranlar ve eşikler */
const ORAN = {
  kdv: 0.20, ustaPay: 0.80, malzemePay: 0.92, fon: 0.02, odeme: 0.025,
  teminat: 0.10, teminatUzman: 0.05, mesaiDisi: 0.15, ekIsEsik: 0.20,
  rezervasyon: 0.10, kucukOran: 0.10, kucukTutar: 1500, kesif: 600, yolBedeli: 350,
};

let S = null;                      // kalıcı durum
let _simdi = null;                 // örnek veri üretirken kullanılan sahte saat
const simdi = () => (_simdi == null ? Date.now() : _simdi);

/* ---------- küçük yardımcılar ---------- */
const yuvarla = n => Math.round(Math.round(n * 100) / 1000) * 10;      // 10 TL’ye yuvarlar; önce kuruşa yuvarlayıp kayan nokta hatasını temizler
const topla = c => c.iscilik + c.malzeme + c.yol + c.fark;
const bosKalem = () => ({ iscilik: 0, malzeme: 0, yol: 0, fark: 0 });
const KALEMLER = ['iscilik', 'malzeme', 'yol', 'fark'];
const hizmet = id => HIZMETLER.find(h => h.id === id);
const bul = id => S.orders.find(o => o.id === id);
const ustaBul = id => S.ustalar.find(u => u.id === id) || null;
const davaBul = id => S.disputes.find(d => d.id === id) || null;
const bolge = (il, ilce) => BOLGELER.find(b => b.il === il && b.ilce === ilce) || null;
const kapsamAnahtar = (il, ilce) => il + '/' + ilce;
const acikMi = (il, ilce, kat) => (S.kapsam[kapsamAnahtar(il, ilce)] || []).includes(kat);
const kapaliMi = o => ['KABUL', 'IPTAL', 'IADE'].includes(o.durum);
const acikDava = o => { const d = davaBul(o.disputeId); return d && d.durum !== 'KAPANDI' ? d : null; };

function slotUret(ts, saat) { const d = new Date(ts); d.setHours(saat, 0, 0, 0); return d.getTime(); }
function mesaiDisiMi(ts) { const d = new Date(ts), g = d.getDay(); return g === 0 || g === 6 || d.getHours() >= 18; }
function isGunuEkle(ts, n) { const d = new Date(ts); while (n > 0) { d.setDate(d.getDate() + 1); const g = d.getDay(); if (g !== 0 && g !== 6) n--; } return d.getTime(); }
function ayEkle(ts, n) { const d = new Date(ts); d.setMonth(d.getMonth() + n); return d.getTime(); }
function iz(o, metin) { o.iz.push({ at: simdi(), metin }); o.gun = simdi(); }

/* ---------- kalıcılık (yalnızca bu tarayıcıda) ---------- */
function kaydet() { try { localStorage.setItem(ANAHTAR, JSON.stringify(S)); } catch (e) { /* depolama yoksa bellekte devam */ } }
function yukle() {
  try { const r = localStorage.getItem(ANAHTAR); if (r) { const j = JSON.parse(r); if (j && j.v === SURUM) return j; } } catch (e) { /* yok say */ }
  return null;
}

/* ---------- fiyatlama (tüm tutarlar KDV dahil TL) ---------- */
function fiyatla(s, opts, il, ilce, slotTs) {
  const b = bolge(il, ilce), k = b ? b.k : 1;
  const adet = Math.max(1, Math.min(Number(opts.adet) || 1, s.maxAdet || 1));
  let birim = s.iscilik, secAd = '';
  if (s.secenekler) { const sec = s.secenekler.find(x => x.id === opts.secenek) || s.secenekler[0]; birim = sec.iscilik; secAd = sec.ad; }
  const iscilik = yuvarla(birim * adet * k);
  const fark = slotTs && mesaiDisiMi(slotTs) ? yuvarla(iscilik * ORAN.mesaiDisi) : 0;
  const malzeme = opts.malzeme && s.malzeme ? s.malzeme.fiyat * adet : 0;
  const yol = b ? b.yol : 0;
  const lines = [{ ad: 'İşçilik' + (secAd ? ' · ' + secAd : adet > 1 ? ' · ' + adet + ' ' + s.birim : ''), tutar: iscilik }];
  if (malzeme) lines.push({ ad: s.malzeme.ad + (adet > 1 ? ' · ' + adet + ' adet' : ''), tutar: malzeme });
  if (fark) lines.push({ ad: 'Mesai dışı farkı (%15)', tutar: fark });
  if (yol) lines.push({ ad: 'Yol bedeli', tutar: yol });
  return { iscilik, fark, malzeme, yol, toplam: iscilik + fark + malzeme + yol, lines };
}

function acilFiyat(s) {
  return { iscilik: s.tani, fark: 0, malzeme: 0, yol: 0, toplam: s.tani, tavan: s.tavan, lines: [{ ad: 'Tanı ve ilk 30 dakika', tutar: s.tani }] };
}

function projeFiyat(s, opts, il, ilce) {
  const b = bolge(il, ilce), k = b ? b.k : 1;
  const m2 = Math.max(s.soru.min, Math.min(Number(opts.m2) || s.soru.varsayilan, s.soru.max));
  let iscilik = 0, malzeme = 0; const lines = [];
  s.kalemler.forEach(kl => {
    const q = kl.sabit ? 1 : m2;
    const i = yuvarla(kl.iscilik * q * k), m = yuvarla(kl.malzeme * q);
    iscilik += i; malzeme += m;
    lines.push({ ad: kl.ad + (kl.sabit ? '' : ' · ' + m2 + ' ' + kl.birim), tutar: i + m, iscilik: i, malzeme: m });
  });
  const yol = b ? b.yol : 0;
  if (yol) lines.push({ ad: 'Yol bedeli', tutar: yol });
  return { iscilik, malzeme, yol, fark: 0, toplam: iscilik + malzeme + yol, lines, m2 };
}

function kapakSayisi(s, opts) { return Math.max(2, Math.round((Number(opts.en) || s.olcu.en[2]) / 50)); }
function mobilyaFiyat(s, opts, il, ilce) {
  const b = bolge(il, ilce);
  const en = Number(opts.en) || s.olcu.en[2], boy = Number(opts.boy) || s.olcu.boy[2];
  const mlz = MALZEMELER.find(m => m.id === opts.malzeme) || MALZEMELER[0];
  const alan = (en / 100) * Math.max(0.6, boy / s.olcu.boy[2]);
  const uretim = yuvarla(s.metre * alan * mlz.k * (s.kapakli && opts.kapak === 'surgulu' ? 1.12 : 1));
  const aksesuar = yuvarla(uretim * 0.12);
  const nakliye = 1800 + (b ? b.yol : 0);
  const montaj = yuvarla(1500 + 400 * (en / 100));
  const lines = [
    { ad: 'Üretim · ' + mlz.ad + ', ' + en + '×' + boy + ' cm', tutar: uretim },
    { ad: 'Menteşe, ray ve kulp', tutar: aksesuar },
    { ad: 'Nakliye', tutar: nakliye },
    { ad: 'Montaj ve ayar', tutar: montaj },
  ];
  return { iscilik: uretim + montaj, malzeme: aksesuar, yol: nakliye, fark: 0, toplam: uretim + aksesuar + nakliye + montaj, lines };
}

/* ---------- defter: her kayıt sıfır toplamlıdır ---------- */
const HESAP_AD = {
  bloke: 'Bloke bakiye', usta: 'Usta alacağı', teminat: 'Usta teminatı', tedarikci: 'Tedarikçi alacağı', fon: 'Garanti fonu',
  gelir: 'Platform geliri', kdv: 'KDV', odeme: 'Ödeme komisyonu', kredi: 'Müşteri kredisi', rucu: 'Ustadan rücu alacağı',
  musteri: 'Müşteri kartları', banka: 'Ustalara ödenen', sermaye: 'Sermaye',
};
function kayit(o, olay, aciklama, satirlar) {
  const lines = satirlar.filter(l => l[1] !== 0).map(l => ({ h: l[0], t: l[1] }));
  if (!lines.length) return;
  S.ledger.unshift({ id: 'l' + (++S.seq), at: simdi(), oid: o ? o.id : null, code: o ? o.code : '—', olay, aciklama, lines });
}
function bakiye() {
  const b = {}; S.ledger.forEach(k => k.lines.forEach(l => { b[l.h] = (b[l.h] || 0) + l.t; })); return b;
}

/* Bir tutarın paylaşımı. c: KDV dahil bileşenler; u: işi yapan usta (yoksa usta payı platformda kalır) */
function bol(c, u) {
  const P = topla(c);
  const R = Math.round(P / (1 + ORAN.kdv)), kdv = P - R;
  const H = u ? Math.round(((c.iscilik + c.fark) * ORAN.ustaPay + c.yol) / (1 + ORAN.kdv)) : 0;
  const M = Math.round(c.malzeme * ORAN.malzemePay / (1 + ORAN.kdv));
  const fon = Math.round(R * ORAN.fon), odeme = Math.round(P * ORAN.odeme);
  const tOran = u && (u.seviye === 'Uzman' || u.seviye === 'Eksper') ? ORAN.teminatUzman : ORAN.teminat;
  return { P, R, kdv, H, M, fon, odeme, gelir: R - H - M - fon - odeme, teminat: Math.round(H * tOran), tOran };
}

function tahsil(o, tutar, aciklama) {
  if (tutar <= 0) return;
  const kr = Math.min(S.credit, tutar);
  S.credit -= kr;
  kayit(o, 'TAHSILAT', aciklama, [['musteri', -(tutar - kr)], ['kredi', -kr], ['bloke', tutar]]);
  o.paid += tutar;
  o.odemeler.push({ tutar, kredi: kr, at: simdi(), aciklama });
}

/* Blokedeki tutarı serbest bırakır. Platformun üstlendiği iade (telafi) varsa
   ustanın ve tedarikçinin payı eksilmez; eksik kalan kısım garanti fonundan karşılanır. */
function serbest(o, c, aciklama) {
  const brut = topla(c);
  if (brut <= 0) return null;
  const telafi = Math.min(o.telafi, brut), nakit = brut - telafi;
  const u = ustaBul(o.ustaId);
  const tam = bol(c, u);
  const R = Math.round(nakit / (1 + ORAN.kdv)), kdv = nakit - R;
  const fon = Math.round(R * ORAN.fon), odeme = Math.round(nakit * ORAN.odeme);
  const fonTelafi = telafi ? Math.round((tam.H + tam.M) * telafi / brut) : 0;
  const gelir = R - fon - odeme - (tam.H + tam.M - fonTelafi);
  kayit(o, 'SERBEST', aciklama, [['bloke', -nakit], ['kdv', kdv], ['usta', tam.H - tam.teminat], ['teminat', tam.teminat],
    ['tedarikci', tam.M], ['fon', fon - fonTelafi], ['odeme', odeme], ['gelir', gelir]]);
  o.telafi -= telafi; o.rel += nakit;
  KALEMLER.forEach(a => { o.relKalem[a] += c[a]; });
  o.teminat += tam.teminat;
  if (tam.H - tam.teminat > 0) o.hakedis.push({ tutar: tam.H - tam.teminat, vade: isGunuEkle(simdi(), 2), odendi: false, at: simdi() });
  if (tam.teminat > 0) o.teminatVade = simdi() + 30 * GUN;
  return { nakit, kdv, H: tam.H, M: tam.M, teminat: tam.teminat, fon: fon - fonTelafi, odeme, gelir };
}

function dus(k, X) { ['iscilik', 'fark', 'yol', 'malzeme'].forEach(a => { const d = Math.min(k[a], X); k[a] -= d; X -= d; }); }
function kalanKalem(o) { const c = bosKalem(); KALEMLER.forEach(a => { c[a] = Math.max(0, o.kalem[a] - o.relKalem[a]); }); return c; }
function payla(o, tutar) {
  const k = o.kalem, T = topla(k) || 1;
  const c = { iscilik: Math.round(k.iscilik * tutar / T), malzeme: Math.round(k.malzeme * tutar / T), yol: Math.round(k.yol * tutar / T), fark: Math.round(k.fark * tutar / T) };
  c.iscilik += tutar - topla(c);
  return c;
}
const blokede = o => o.paid - o.rel - o.refunded + (o.sonraIade || 0);   // kabulden sonraki iadeler blokeden çıkmaz
const ustaPayi = o => bol(o.kalem, ustaBul(o.ustaId || (o.offer && o.offer.ustaId)));

/* Kabulden önce iade: para blokedeyse karta döner; henüz çekilmediyse çekilecek tutar küçülür */
const indirimTavan = o => (o.stages ? o.paid : Math.max(o.paid, o.fiyat.toplam)) - o.refunded;
function iadeOnce(o, X, yuk, aciklama) {
  const nakit = Math.max(0, Math.min(X, blokede(o)));

function rehberHtml() {

  if (!a) return `<button class="rehber" data-act="rehberYeni"><span class="rehber-et">Demo</span><span class="rehber-metin"><b>Bekleyen adım kalmadı.</b> Yeni bir sipariş ver</span>${ikon('sag')}</button>`;
  const burada = a.rol === S.rol && a.git[0] === V.ad && (a.git[1].id || '') === (V.p.id || '') && (a.rol !== 'usta' || a.usta === S.ustaId);
  if (burada) return '';
  const kim = a.rol === 'usta' ? ustaBul(a.usta).ad : ROL_AD[a.rol];
  return `<button class="rehber" data-act="rehber"><span class="rehber-et">Sıradaki adım</span><span class="rehber-metin"><b>${esc(kim)}:</b> ${esc(a.metin)} <small>${esc(a.ad)}</small></span>${ikon('sag')}</button>`;
}
function cati(govde) {
  const rol = S.rol, aktif = SEKME_KOKU[V.ad] || V.ad;
  return `<div class="demo"><span class="demo-et"><b>DEMO</b><i>örnek veri<u> · gerçek ödeme alınmaz</u></i></span>
    <div class="rol" role="group" aria-label="Rol seç">${Object.keys(ROL_AD).map(r => `<button data-act="rol" data-rol="${r}" class="${r === rol ? 'sec' : ''}" aria-pressed="${r === rol}">${ROL_AD[r]}</button>`).join('')}</div></div>
  <header class="bas"><button class="logo" data-act="kok" aria-label="Mahir · ana sayfa">${LOGO}</button>${baglam()}</header>
  <div class="govde">
    <nav class="sekme" aria-label="Bölümler">${SEKMELER[rol].map(s => { const n = rozetSayisi(rol, s[0]); return `<button data-act="sekme" data-ad="${s[0]}" class="${s[0] === aktif ? 'sec' : ''}"${s[0] === aktif ? ' aria-current="page"' : ''}>${ikon(s[2])}<span>${s[1]}</span>${n ? `<i class="sayi">${n}</i>` : ''}</button>`; }).join('')}</nav>
    <div class="orta"><main id="icerik" class="rol-${rol} g-${V.ad}" tabindex="-1"><div class="sayfa">${govde}</div></main>${rehberHtml()}</div>
  </div>
  ${SH ? `<div class="perde${SH_YENI ? ' giris' : ''}" data-act="sheetKapat"></div><div class="sheet${SH_YENI ? ' giris' : ''}" role="dialog" aria-modal="true" aria-label="${esc(SH.p.baslik || 'Panel')}"><span class="tutamak"></span><button class="sheet-kapat" data-act="sheetKapat" aria-label="Kapat">${ikon('carpi')}</button><div class="sheet-ic">${SHEET[SH.ad](SH.p, SH.f)}</div></div>` : ''}`;
}
function ciz(basa) {
  const eski = $('#icerik'), y = eski && !basa ? eski.scrollTop : 0;
  const sEski = $('.sheet-ic'), sy = sEski && !SH_YENI ? sEski.scrollTop : 0;
  if (!G[V.ad]) V = yeniV(KOK[S.rol]);
  if (SH && !SHEET[SH.ad]) SH = null;
  let govde;
  try { govde = G[V.ad](V.p, V.f); } catch (e) { console.error(e); govde = bos('Bu ekran açılamadı. Hesap sekmesinden örnek veriyi sıfırlayabilirsin.', 'uyari'); }
  $('#app').innerHTML = cati(govde);
  $('#icerik').scrollTop = y;
  if ($('.sheet-ic')) $('.sheet-ic').scrollTop = sy;
  if (SH_YENI && $('.sheet')) $('.sheet').setAttribute('tabindex', '-1');
  SH_YENI = false;
}

/* ---------- genel eylemler ---------- */
Object.assign(EYLEM, {
  rol: d => rolDegis(d.rol),
  git: d => git(d.ad, d.id ? { id: d.id } : d.kat ? { kat: d.kat } : {}),
  sekme: d => { YIGIN = []; V = yeniV(d.ad); SH = null; ciz(true); },
  geri: () => geri(),
  kok: () => { YIGIN = []; V = yeniV(KOK[S.rol]); SH = null; ciz(true); },
  sheet: d => sheetAc(d.ad, Object.assign({}, d)),
  sheetKapat: () => sheetKapat(),
  sec: (d, el) => { const f = el.closest('.sheet') && SH ? SH.f : V.f; f[d.k] = f[d.k] === d.v && d.kapat ? '' : d.v; ciz(); },
  adim: (d, el) => { const f = el.closest('.sheet') && SH ? SH.f : V.f; f[d.k] = Math.max(Number(d.min), Math.min(Number(d.max), (Number(f[d.k]) || 0) + Number(d.d))); ciz(); },
  rehber: () => { const a = sonrakiAdim(); if (!a) return; if (a.rol === 'usta') S.ustaId = a.usta; rolDegis(a.rol, a.git[0], a.git[1]); },
  rehberYeni: () => rolDegis('musteri'),
  konumSec: d => { S.il = d.il; S.ilce = d.ilce; SH = null; degisti(d.ilce + ', ' + d.il + ' seçildi'); },
  ustaSecildi: d => { S.ustaId = d.id; YIGIN = []; V = yeniV('u_teklifler'); SH = null; degisti(); },
  sifirla: () => { tohumla(); saatKontrol(); kaydet(); YIGIN = []; V = yeniV(KOK[S.rol]); SH = null; ciz(true); toast('Örnek veri sıfırlandı'); },
  fotoSil: d => { fotoListe(d.hedef).splice(Number(d.i), 1); degisti(); },
  ornekFoto: d => { const l = fotoListe(d.hedef); if (l.length < 4) l.push('ornek:' + (d.ad || 'Fotoğraf')); degisti(); },
  mesaj: (d, el) => {
    const o = bul(V.p.id); if (!o) return;
    const metin = d.metin || V.f.mesaj || '';
    const r = mesajGonder(o, d.kim, metin);
    if (!r.ok) { if (r.neden) toast(r.neden, 'hata'); return; }
    V.f.mesaj = ''; degisti();
    const m = $('.mesajlar'); if (m) m.scrollTop = m.scrollHeight;
  },
});

SHEET.konum = () => {
  const iller = []; BOLGELER.forEach(b => { if (!iller.includes(b.il)) iller.push(b.il); });
  return `<h2>Hizmet bölgesi</h2><p class="sheet-alt">Fiyatlar ve açık kategoriler ilçeye göre değişir.</p>
    ${iller.map(il => `<h3>${esc(il)}</h3><div class="secim-liste">${BOLGELER.filter(b => b.il === il).map(b => { const n = (S.kapsam[kapsamAnahtar(b.il, b.ilce)] || []).length; return `<button data-act="konumSec" data-il="${esc(b.il)}" data-ilce="${esc(b.ilce)}" class="${b.il === S.il && b.ilce === S.ilce ? 'sec' : ''}"><span>${esc(b.ilce)}</span><small>${n === KATEGORILER.length ? 'Tüm kategoriler açık' : n + '/' + KATEGORILER.length + ' kategori açık'}</small></button>`; }).join('')}</div>`).join('')}
    ${not('Listede olmayan ilçeler için bekleme listesi açılır: bir ilçe, kategoride en az 3 aktif usta olunca hizmete girer.')}`;
};
SHEET.ustaSec = () => `<h2>Hangi usta olarak bakıyorsun?</h2><p class="sheet-alt">Demoda her ustanın ekranını görebilirsin.</p>
  <div class="secim-liste">${S.ustalar.map(u => { const n = S.orders.filter(o => o.offer && o.offer.ustaId === u.id).length, a = S.orders.filter(o => o.ustaId === u.id && !kapaliMi(o)).length; return `<button data-act="ustaSecildi" data-id="${u.id}" class="${u.id === S.ustaId ? 'sec' : ''}"><span>${esc(u.ad)} <em>${MESLEK_AD[u.meslek]}</em></span><small>${u.seviye}${u.aski ? ' · askıda' : ''}${n ? ' · ' + n + ' teklif' : ''}${a ? ' · ' + a + ' aktif iş' : ''}</small></button>`; }).join('')}</div>`;
SHEET.bilgi = p => `<h2>${esc(p.baslik)}</h2><p class="sheet-metin">${p.metin}</p><button class="btn" data-act="sheetKapat">Tamam</button>`;
SHEET.onay = p => `<h2>${esc(p.baslik)}</h2><p class="sheet-metin">${esc(p.metin)}</p>
  <div class="btn-sira"><button class="btn ikincil" data-act="sheetKapat">Vazgeç</button><button class="btn${p.tehlike ? ' tehlike' : ''}" data-act="${p.eylem}" data-id="${p.id || ''}" data-ek="${esc(p.ek || '')}">${esc(p.etiket)}</button></div>`;

/* ---------- olay dinleyiciler ---------- */
function olaylar() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const fn = EYLEM[el.dataset.act]; if (!fn) return;
    e.preventDefault(); fn(el.dataset, el, e);
  });
  document.addEventListener('input', e => {
    const el = e.target, k = el.dataset && el.dataset.f; if (!k) return;
    const f = el.closest('.sheet') && SH ? SH.f : V.f;
    f[k] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.canli && CANLI[V.ad]) CANLI[V.ad](V.p, V.f);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.foto && el.files && el.files[0]) { const hedef = el.dataset.foto; fotoOku(el.files[0], url => { const l = fotoListe(hedef); if (l.length < 4) l.push(url); degisti(); }); return; }
    if (el.dataset && el.dataset.ciz) ciz();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && SH) { sheetKapat(); return; }
    const el = e.target;
    if (e.key === 'Enter' && el.dataset && el.dataset.enter && EYLEM[el.dataset.enter]) { e.preventDefault(); EYLEM[el.dataset.enter](el.dataset, el, e); }
  });
  window.addEventListener('hashchange', () => { const r = Object.keys(ROL_HASH).find(x => ROL_HASH[x] === location.hash.slice(1)); if (r && r !== S.rol) rolDegis(r); });
  setInterval(() => { if (saatKontrol()) { kaydet(); const el = document.activeElement; if (!SH && !(el && el.matches && el.matches('input, textarea'))) ciz(); } }, 30000);
}

let LOGO = '', OLAY_HAZIR = false;
function basla() {
  LOGO = $('#logo-tpl').innerHTML;
  baslat();
  const r = Object.keys(ROL_HASH).find(x => ROL_HASH[x] === location.hash.slice(1));
  if (r) S.rol = r;
  V = yeniV(KOK[S.rol]); YIGIN = []; SH = null;
  if (!OLAY_HAZIR) { olaylar(); OLAY_HAZIR = true; }      // bozuk kayıttan kurtulurken dinleyiciler iki kez bağlanmasın
  ciz(true);
}

/* ===== Mahir · müşteri ekranları ===== */

const SAATLER = [9, 11, 13, 15, 17, 19];
function gunler() { const a = [], b = new Date(); for (let i = 1; i <= 6; i++) a.push(new Date(b.getFullYear(), b.getMonth(), b.getDate() + i).getTime()); return a; }
const cip = (k, v, ad, secili) => `<button class="cp${String(secili) === String(v) ? ' sec' : ''}" data-act="sec" data-k="${k}" data-v="${v}" aria-pressed="${String(secili) === String(v)}">${ad}</button>`;
const sayac = (k, v, min, max, birim) => `<div class="sayac"><button data-act="adim" data-k="${k}" data-d="-1" data-min="${min}" data-max="${max}" aria-label="Azalt"${Number(v) <= min ? ' disabled' : ''}>${ikon('eksi')}</button><output>${v} <small>${birim}</small></output><button data-act="adim" data-k="${k}" data-d="1" data-min="${min}" data-max="${max}" aria-label="Artır"${Number(v) >= max ? ' disabled' : ''}>${ikon('arti')}</button></div>`;

function fiyatEtiket(s) {
  const b = bolge(S.il, S.ilce), k = b ? b.k : 1;
  if (s.tip === 'standart') return s.secenekler ? 'Başlangıç ' + tl(yuvarla(Math.min.apply(null, s.secenekler.map(x => x.iscilik)) * k)) : tl(yuvarla(s.iscilik * k)) + ' / ' + s.birim;
  if (s.tip === 'acil') return 'Tanı ' + tl(s.tani);
  return s.tip === 'proje' ? 'Keşifle teklif' : 'Ölçüye göre teklif';
}
function hizmetSatir(s) {
  return `<button class="kart hiz" data-act="git" data-ad="hizmet" data-id="${s.id}"><span class="rozet">${ikon(s.ikon)}</span>
    <span class="hiz-orta"><b>${esc(s.ad)}</b><small>${esc(s.kisa)}</small><span class="hiz-alt"><em>${fiyatEtiket(s)}</em><i>${esc(s.sure)}</i></span></span>${ikon('sag', 'ok')}</button>`;
}
function dikkatKart(o) {
  const a = adimBul(o);
  return `<button class="kart dikkat" data-act="git" data-ad="siparis" data-id="${o.id}"><span class="rozet">${ikon(hizmet(o.sid).ikon)}</span>
    <span class="sip-orta"><b>${esc(a && a.rol === 'musteri' ? a.metin : 'Yanıtını bekliyor')}</b><small>${esc(o.ad)} · ${o.code}</small></span>${ikon('sag', 'ok')}</button>`;
}
function kapaliKutu(katId) {
  const var_ = S.waitlist.some(w => w.ben && w.il === S.il && w.ilce === S.ilce && w.kat === katId);
  return `<section class="kart eylem bekle"><h2>${esc(S.ilce)} için henüz açık değil</h2>
    <p>Bir ilçeyi, o kategoride en az 3 aktif ustamız olunca ve işlerin %90’ını 24 saat içinde atayabildiğimizde açıyoruz.</p>
    ${var_ ? not('Bekleme listesindesin. Açılınca haber vereceğiz.') : `<button class="btn" data-act="bekleme" data-kat="${katId}">Açılınca haber ver</button>`}</section>`;
}

/* ---------- ana sayfa ---------- */
G.ana = () => {
  const sen = S.orders.filter(o => DURUM[o.durum].sinif === 'sen' || o.extras.some(e => e.durum === 'bekliyor'));
  const acilAcik = acikMi(S.il, S.ilce, 'acil');
  return `<section class="vitrin"><h1>Evin <span>mahir</span> ellerde.</h1><p>Ustayı Mahir seçer, fiyatı baştan söyler, paranı iş bitene kadar tutar.</p></section>
  ${sen.map(dikkatKart).join('')}
  ${S.credit > 0 ? `<p class="kredi-serit">${ikon('cuzdan')}<span><b>${tl(S.credit)}</b> Mahir kredin var; sonraki ödemende kendiliğinden düşer.</span></p>` : ''}
  <h2 class="bolum">Ne lazım?</h2>
  <button class="acil-kart" data-act="git" data-ad="kategori" data-kat="acil"><span class="rozet">${ikon('bolt')}</span><span><b>Acil mi?</b><small>${acilAcik ? 'Su kaçağı, elektrik arızası, kapıda kalma: 60 dakikada usta' : esc(S.ilce) + ' için henüz açık değil'}</small></span>${ikon('sag', 'ok')}</button>
  <div class="kat-izgara">${KATEGORILER.filter(k => k.id !== 'acil').map(k => { const a = acikMi(S.il, S.ilce, k.id); return `<button class="kat${a ? '' : ' kapali'}" data-act="git" data-ad="kategori" data-kat="${k.id}"><span class="rozet">${ikon(k.ikon)}</span><b>${k.ad}</b><small>${a ? k.acik : 'Yakında'}</small></button>`; }).join('')}</div>
  <h2 class="bolum">Sık istenenler</h2>
  <div class="liste">${['musluk', 'temizlik', 'klima', 'avize'].map(id => hizmetSatir(hizmet(id))).join('')}</div>
  <p class="dipnot">Fiyatlar örnektir, KDV dahildir; ilçeye göre değişir.</p>
  <h2 class="bolum">Nasıl çalışır</h2>
  <ol class="nasil">
    <li><b>Seç, randevunu al.</b><span>Fiyatı baştan görürsün. Ustayı Mahir atar; pazarlık ve telefon trafiği yok.</span></li>
    <li><b>Ödemen Mahir’de bloke kalır.</b><span>Kartından çekilen tutar, sen işi onaylayana kadar ustaya geçmez.</span></li>

  </ol>`;
};

G.kategori = p => {
  const k = KATEGORILER.find(x => x.id === p.kat) || KATEGORILER[0], acik = acikMi(S.il, S.ilce, k.id);
  return sayfaBas(k.ad, S.ilce + ', ' + S.il) + (acik ? '' : kapaliKutu(k.id)) +
    `<div class="liste${acik ? '' : ' soluk'}">${HIZMETLER.filter(h => h.kat === k.id).map(hizmetSatir).join('')}</div><p class="dipnot">Fiyatlar örnektir, KDV dahildir.</p>`;
};

/* ---------- hizmet ve sipariş formu ---------- */
function hizmetVarsayilan(s, f) {
  if (f._hazir) return; f._hazir = 1;
  f.adres = S.adres; f.not = ''; f.fotos = [];
  if (s.tip === 'standart') { f.adet = 1; f.secenek = s.secenekler ? s.secenekler[Math.min(1, s.secenekler.length - 1)].id : ''; f.malzeme = ''; f.gun = String(gunler()[0]); f.saat = '11'; }
  if (s.tip === 'proje') { f.m2 = s.soru.varsayilan; f.kesif = 'video'; }
  if (s.tip === 'mobilya') { f.en = s.olcu.en[2]; f.boy = s.olcu.boy[2]; f.derinlik = s.olcu.derinlik[2]; f.malzeme = 'lam'; f.kapak = 'menteseli'; f.numune = NUMUNELER[0].kod; }
}
const standartOpts = f => ({ adet: Number(f.adet) || 1, secenek: f.secenek, malzeme: f.malzeme === 'mahir' });
const mobilyaOpts = f => ({ en: Number(f.en), boy: Number(f.boy), derinlik: Number(f.derinlik), malzeme: f.malzeme, kapak: f.kapak, numune: f.numune });

function adresBolumu(f) {
  return `<section class="kart"><h2>Adres ve not</h2>
    <label class="alan"><span>Adres · ${esc(S.ilce)}, ${esc(S.il)}</span><input type="text" data-f="adres" value="${esc(f.adres)}" maxlength="120" autocomplete="street-address"></label>
    <label class="alan"><span>Ustaya not <i>isteğe bağlı</i></span><textarea data-f="not" rows="2" maxlength="300" placeholder="Örn. zil çalışmıyor, evde kedi var">${esc(f.not)}</textarea></label>
    <h3>Fotoğraf <i>isteğe bağlı</i></h3>${fotoAlan('f:fotos', f.fotos, 'İş yeri')}</section>`;
}
function fiyatKutusu(fy, slot) {
  const sonra = slot - Date.now() > 24 * SAAT;
  return `<h2>Fiyat</h2>${satirlar(fy.lines, fy.toplam)}
    ${not(sonra ? 'Kartından şimdi çekim yapılmaz. Tutar randevudan 24 saat önce çekilir ve işi onaylayana kadar Mahir’de bloke kalır.' : 'Tutar şimdi çekilir ve işi onaylayana kadar Mahir’de bloke kalır.', 'kilit')}`;
}
function tahminKutusu(s, fy) {
  const plan = s.tip === 'proje' ? '%30 iş başlarken, %40 ikinci aşamada, %30 son aşamada çekilir. Her aşamanın bedeli, sen o aşamayı onaylayınca ustaya aktarılır.' : '%40 üretim onayında, %40 sevk öncesinde, %20 montajı kabul ettiğinde çekilir. Tamamı, montajı kabul edene kadar Mahir’de bloke kalır.';
  return `<h2>Ön tahmin</h2><p class="tahmin">${tl(yuvarla(fy.toplam * 0.92))} – ${tl(yuvarla(fy.toplam * 1.1))}</p>
    <p class="ipucu">Kesin fiyat ${s.tip === 'proje' ? 'keşiften' : 'ölçüden'} sonra kalem kalem gelir ve 7 gün geçerlidir.</p>${not(plan, 'kilit')}`;
}

function mobilyaCizim(s, f) {
  const en = Number(f.en), boy = Number(f.boy), W = 340, H = 236, sol = 46, alt = 40, ust = 12, sag = 12;
  const k = Math.min((W - sol - sag) / en, (H - ust - alt) / boy);
  const w = en * k, h = boy * k, x = sol + (W - sol - sag - w) / 2, y = ust + (H - ust - alt - h);
  const renk = (NUMUNELER.find(n => n.kod === f.numune) || NUMUNELER[0]).hex;
  const cz = `stroke="var(--ink)" stroke-width="1.4" fill="${renk}"`;
  const kapaklar = (x0, y0, w0, h0, n, kulp) => {
    let t = '';
    for (let i = 0; i < n; i++) {
      const cx = x0 + (w0 / n) * i;
      t += `<rect x="${cx.toFixed(1)}" y="${y0.toFixed(1)}" width="${(w0 / n).toFixed(1)}" height="${h0.toFixed(1)}" ${cz}/>`;
      if (kulp) { const kx = i % 2 === 0 ? cx + w0 / n - 6 : cx + 6, u = Math.min(16, h0 * 0.16); t += `<line x1="${kx.toFixed(1)}" y1="${(y0 + h0 / 2 - u).toFixed(1)}" x2="${kx.toFixed(1)}" y2="${(y0 + h0 / 2 + u).toFixed(1)}" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>`; }
    }
    return t;
  };
  let ic;
  if (s.id === 'mutfak') {
    const n = kapakSayisi(s, f) + 1, ustH = h * 0.30, altH = h * 0.36;
    ic = kapaklar(x, y, w, ustH, n, true) + kapaklar(x, y + h - altH, w, altH, n, true) + `<rect x="${(x - 3).toFixed(1)}" y="${(y + h - altH - 5).toFixed(1)}" width="${(w + 6).toFixed(1)}" height="5" fill="var(--ink)"/>`;
  } else if (s.id === 'tvunite') ic = kapaklar(x, y, w, h, Math.max(2, Math.round(en / 70)), true);
  else if (f.kapak === 'surgulu') {
    const n = en > 260 ? 3 : 2;
    ic = kapaklar(x, y, w, h, n, false) + Array.from({ length: n }, (_, i) => `<rect x="${(x + (w / n) * i + (i % 2 ? 6 : w / n - 12)).toFixed(1)}" y="${(y + h * 0.32).toFixed(1)}" width="6" height="${(h * 0.36).toFixed(1)}" rx="3" fill="var(--ink)" opacity=".7"/>`).join('');
  } else ic = kapaklar(x, y, w, h, kapakSayisi(s, f), true);
  const cent = (x1, y1, x2, y2, n, dikey) => {
    let t = '';
    for (let i = 0; i <= n; i++) { const px = x1 + (x2 - x1) * i / n, py = y1 + (y2 - y1) * i / n, u = i % 5 === 0 ? 8 : 4; t += dikey ? `<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${(px + u).toFixed(1)}" y2="${py.toFixed(1)}"/>` : `<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${px.toFixed(1)}" y2="${(py - u).toFixed(1)}"/>`; }
    return t;
  };
  const ry = H - alt + 8, rx = sol - 32;
  return `<svg viewBox="0 0 ${W} ${H}" class="cizim" role="img" aria-label="${esc(s.ad)} ön görünüş, ${en} × ${boy} cm">
    <line x1="${rx}" y1="${(y + h).toFixed(1)}" x2="${W - 4}" y2="${(y + h).toFixed(1)}" stroke="var(--line)" stroke-width="1.5"/>${ic}
    <rect x="${x.toFixed(1)}" y="${ry}" width="${w.toFixed(1)}" height="12" fill="var(--sari)"/><rect x="${rx}" y="${y.toFixed(1)}" width="12" height="${h.toFixed(1)}" fill="var(--sari)"/>
    <g stroke="#0D2B26" stroke-width="1">${cent(x, ry + 12, x + w, ry + 12, Math.round(en / 10), false)}${cent(rx, y, rx, y + h, Math.round(boy / 10), true)}</g>
    <text x="${(x + w / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle" class="olcu">${en} cm</text>
    <text x="${rx - 6}" y="${(y + h / 2).toFixed(1)}" text-anchor="middle" class="olcu" transform="rotate(-90 ${rx - 6} ${(y + h / 2).toFixed(1)})">${boy} cm</text></svg>`;
}

const FORM = {

      <p class="ipucu">${esc(s.soru.ipucu)}</p></section>
    <section class="kart"><h2>Keşif</h2><div class="secim-liste">

      ${s.kapakli ? `<h3>Kapak</h3><div class="cipler">${cip('kapak', 'menteseli', 'Menteşeli', f.kapak)}${cip('kapak', 'surgulu', 'Sürgülü', f.kapak)}</div>` : ''}

CANLI.hizmet = (p, f) => {

};

    ${kr > 0 ? satirlar([{ ad: 'Mahir kredin', tutar: -kr }, { ad: 'Karttan çekilecek', tutar: p.tutar - kr }]) : ''}

    ${p.not ? not(p.not, 'kilit') : ''}

    <button class="btn" data-act="odeOnay"${hazir ? '' : ' disabled'}>${esc(p.etiket)}</button>`;

const ON_BILGI = 'Ön bilgilendirme formunu ve mesafeli sözleşmeyi okudum, onaylıyorum.';

Object.assign(EYLEM, {
  bekleme: d => { S.waitlist.push({ il: S.il, ilce: S.ilce, kat: d.kat, at: Date.now(), ben: true }); degisti('Bekleme listesine eklendin'); },
  odeAc: d => {
    const o = d.id ? bul(d.id) : null;
    if (d.tur === 'standart' || d.tur === 'acil' || d.tur === 'talep') {
      const s = hizmet(V.p.id), f = V.f;
      if (String(f.adres || '').trim().length < 5) { toast('Adresini yaz ki usta seni bulabilsin.', 'hata'); const a = $('[data-f="adres"]'); if (a) a.focus(); return; }
      if (d.tur === 'standart') {
        const slot = slotUret(Number(f.gun), Number(f.saat)), fy = fiyatla(s, standartOpts(f), S.il, S.ilce, slot), sonra = slot - Date.now() > 24 * SAAT;
        return sheetAc('ode', { tur: 'standart', baslik: 'Siparişi onayla', alt: s.ad + ' · ' + zaman(slot), tutar: fy.toplam, tutarAd: sonra ? 'Randevudan 24 saat önce çekilecek' : 'Şimdi çekilecek',
          not: 'Ödemen Mahir’de bloke kalır; işi onayladığında ustaya aktarılır. Randevuya 24 saat kalana kadar ücretsiz iptal edebilirsin.', onaylar: [ON_BILGI], etiket: 'Siparişi onayla' });
      }
      if (d.tur === 'acil') return sheetAc('ode', { tur: 'acil', baslik: 'Ustayı çağır', alt: s.ad + ' · 60 dakika içinde', tutar: s.tani, tutarAd: 'İş bitince çekilecek en az tutar',
        not: 'Şimdi yalnızca kartın doğrulanır. Toplam, ' + tl(s.tavan) + ' tavan fiyatı aşamaz. Usta yola çıkmadan iptal ücretsizdir.', onaylar: [ON_BILGI, 'Hizmetin hemen başlamasını istiyorum; başladıktan sonra cayma hakkımın olmadığını biliyorum.'], etiket: 'Ustayı çağır' });
      const yerinde = s.tip === 'mobilya' || f.kesif === 'yerinde';
      return sheetAc('ode', { tur: 'talep', baslik: s.tip === 'mobilya' ? 'Ölçü randevusu' : 'Keşif talebi', alt: s.ad, tutar: yerinde ? ORAN.kesif : 0, tutarAd: yerinde ? 'Şimdi çekilecek' : 'Ücretsiz',
        not: yerinde ? 'Bu bedel, siparişe dönüşürse ilk ödemeden düşülür. Ölçü ya da keşif yapılmadan iptal edersen tamamı iade edilir.' : 'Teklif gelene kadar hiçbir ödeme alınmaz.', etiket: yerinde ? 'Onayla ve öde' : 'Talebi gönder' });
    }
    if (d.tur === 'teklif') {
      const st = o.stages[0], mahsup = Math.min(blokede(o), st.tutar), mob = o.tip === 'mobilya';
      return sheetAc('ode', { tur: 'teklif', id: o.id, baslik: 'Teklifi onayla', alt: o.ad + ' · toplam ' + tl(o.fiyat.toplam), tutar: st.tutar - mahsup, tutarAd: mob ? 'Üretim onayı ödemesi (%40)' : 'İlk aşama ödemesi (%30)',
        not: (mahsup ? tl(mahsup) + ' keşif bedeli bu ödemeden düşüldü. ' : '') + (mob ? 'Tutar, montajı kabul edene kadar Mahir’de bloke kalır.' : 'Tutar, ilk aşamayı onaylayana kadar Mahir’de bloke kalır.'),
        onaylar: mob ? ['Ölçüler doğru: ' + o.opts.en + ' × ' + o.opts.boy + ' × ' + o.opts.derinlik + ' cm.', 'Teknik çizimi onaylıyorum.', 'Numune rengi doğru: ' + esc((NUMUNELER.find(n => n.kod === o.opts.numune) || NUMUNELER[0]).ad) + ' (' + esc(o.opts.numune) + ').', 'Ürün bana özel üretilecek; üretim onayından sonra cayma hakkımın olmadığını biliyorum.'] : ['Teklif kalemlerini ve üç aşamalı ödeme planını onaylıyorum.', ON_BILGI],
        etiket: 'Onayla ve öde' });

      const i = o.stages.findIndex(st => st.done && !st.accepted), st = o.stages[i], nx = o.stages[i + 1];
      return sheetAc('ode', { tur: 'asama', id: o.id, baslik: '“' + st.ad + '” aşamasını onayla', alt: 'Bu aşamanın bedeli ustaya aktarılır', tutar: nx.paid ? 0 : nx.tutar, tutarAd: 'Sonraki aşama için çekilecek (%' + nx.pct + ')',
        not: '“' + nx.ad + '” aşamasının bedeli, sen o aşamayı da onaylayana kadar Mahir’de bloke kalır.', etiket: 'Aşamayı onayla' });

    }
  },
  odeOnay: () => {
    const p = SH.p, o = p.id ? bul(p.id) : null;
    if (p.tur === 'standart' || p.tur === 'acil') {
      const f = V.f, y = siparisOlustur({ sid: V.p.id, opts: standartOpts(f), slotTs: p.tur === 'acil' ? null : slotUret(Number(f.gun), Number(f.saat)), adres: f.adres.trim(), not: String(f.not || '').trim(), fotos: f.fotos });
      S.adres = f.adres.trim(); kaydet(); kokeGit('siparis', { id: y.id }); return toast(p.tur === 'acil' ? 'Usta aranıyor' : 'Siparişin alındı');
    }
    if (p.tur === 'talep') {
      const f = V.f, s = hizmet(V.p.id);
      const y = talepOlustur({ sid: s.id, opts: s.tip === 'mobilya' ? mobilyaOpts(f) : { m2: Number(f.m2) }, kesif: s.tip === 'mobilya' ? 'yerinde' : f.kesif, adres: f.adres.trim(), not: String(f.not || '').trim(), fotos: f.fotos });
      S.adres = f.adres.trim(); kaydet(); kokeGit('siparis', { id: y.id }); return toast('Talebin alındı');
    }
    if (p.tur === 'teklif') teklifOnayla(o);
    else if (p.tur === 'asama') asamaOnay(o);
    else if (p.tur === 'sevk') sevkOde(o);
    else if (p.tur === 'ekis') ekIsKarar(o, p.ek, true);
    SH = null; degisti({ teklif: 'Teklif onaylandı', asama: 'Aşama onaylandı', sevk: 'Ödeme alındı', ekis: 'Ek iş onaylandı' }[p.tur]);
  },
  ekIsRet: d => { ekIsKarar(bul(d.id), d.ek, false); degisti('Ek iş reddedildi'); },
  kabulOnay: d => { const o = bul(d.id), puan = Number(SH.f.puan) || 0; kabul(o, { puan }); SH = null; degisti('Eline sağlık! Ödeme serbest bırakıldı'); },
  iptalOnay: d => { const o = bul(d.id), h = iptalEt(o); SH = null; degisti(h.izin ? (h.iade ? tl(h.iade) + ' iade edildi' : 'Sipariş iptal edildi') : h.neden, h.izin ? '' : 'hata'); },
  sikayetGonder: () => {

    const d = sikayetAc(o, { tur: t.id, aciklama: f.aciklama, talep, tutar: talep === 'indirim' ? f.tutar : 0, fotos: f.fotos || [] });
    kaydet(); V = YIGIN.pop() || yeniV('siparis', { id: o.id });
    const k = d.karar;
    sheetAc('bilgi', d.oto ? { baslik: k.sonuc === 'duzeltme' ? 'Ücretsiz düzeltme planlandı' : k.sonuc === 'indirim' ? tl(k.tutar) + ' bedel indirimi' : 'Sipariş durduruldu', metin: esc(k.not) }
      : { baslik: 'Şikâyetin alındı', metin: 'Ustanın 24 saat içinde yanıt vermesi istenir; Mahir en geç 48 saatte karar verir. Ödemen bu sürede ustaya aktarılmaz.' });
  },
  adresKaydet: () => { const a = String(V.f.adres || '').trim(); if (a.length < 5) return toast('Adres çok kısa.', 'hata'); S.adres = a; degisti('Adres kaydedildi'); },
});

function teklifKart(o, s) {
  const gun = Math.max(0, Math.ceil((o.teklif.gecerli - Date.now()) / GUN));
  return `<section class="kart eylem"><div class="kart-ust"><h2>Teklifin hazır</h2><span class="cip cip-bekle">${gun} gün geçerli</span></div>
    ${o.tip === 'mobilya' ? `<div class="cizim-kutu">${mobilyaCizim(s, o.opts)}</div><p class="ipucu">Teknik çizim · ${o.opts.en} × ${o.opts.boy} × ${o.opts.derinlik} cm · ${esc((MALZEMELER.find(m => m.id === o.opts.malzeme) || MALZEMELER[0]).ad)}${s.kapakli ? ', ' + (o.opts.kapak === 'surgulu' ? 'sürgülü' : 'menteşeli') + ' kapak' : ''}</p>` : ''}
    ${satirlar(o.fiyat.lines, o.fiyat.toplam)}
    <h3>Ödeme planı</h3><ul class="asamalar">${o.stages.map(st => `<li>${ikon('saat')}<span>${esc(st.ad)} <em>%${st.pct}</em></span><b>${tl(st.tutar)}</b></li>`).join('')}</ul>
    <button class="btn" data-act="odeAc" data-tur="teklif" data-id="${o.id}">Teklifi incele ve onayla</button></section>`;
}
function musteriEylem(o, s, u) {
  const onde = o.durum === 'TESLIM' || o.durum === 'ASAMA_ONAY';
  const sorun = sikayetTurleri(o).length ? `<button class="btn ${onde ? 'ikincil' : 'metin'}" data-act="git" data-ad="sikayet" data-id="${o.id}">Sorun bildir</button>` : '';
  const kod = `<div class="kapi"><div class="kapi-kod" aria-label="Kapı kodu ${o.kod.split('').join(' ')}">${o.kod.split('').map(c => `<span>${c}</span>`).join('')}</div><p>Usta kapıya gelince bu kodu söyle. Kod girilmeden iş başlamış sayılmaz.</p></div>`;
  const ek = o.extras.filter(e => e.durum === 'bekliyor').map(e => ekIsKart(o, e)).join('') +
    o.extras.filter(e => e.durum === 'uzman').map(e => `<section class="kart eylem bekle"><h2>Ek iş inceleniyor</h2><p>Usta <b>${esc(e.ad)}</b> için ${tl(e.tutar)} istedi. İlk fiyatın %20’sini aştığı için önce Mahir uzmanı bakıyor; uygun bulursa onayına gelecek.</p></section>`).join('');
  switch (o.durum) {
    case 'TEKLIF_BEKLIYOR': return `<section class="kart eylem bekle"><h2>Teklifin hazırlanıyor</h2><p>${o.kesif === 'yerinde' ? 'Mahir uzmanı ' + (o.tip === 'mobilya' ? 'ölçü' : 'keşif') + ' için seni arayıp randevu verecek.' : 'Görüntülü keşif için seni arayacağız.'} Kalem kalem teklif bu ekrana düşecek.</p></section>`;
    case 'TEKLIF_HAZIR': return teklifKart(o, s);
    case 'ATAMA': return `<section class="kart eylem bekle"><h2>${o.duzeltme ? 'Düzeltme için usta atanıyor' : 'Ustan atanıyor'}</h2><p>${o.atamaBekliyor ? 'Operasyon ekibi sana uygun ustayı arıyor.' : 'İşi bölgendeki en uygun ustaya teklif ettik; 30 dakika içinde yanıt verir.'}</p></section>`;
    case 'PLANLANDI': case 'YOLDA': case 'MONTAJ': {
      const yolda = o.durum === 'YOLDA' || o.yolda;
      return `<section class="kart eylem${yolda ? '' : ' bekle'}"><h2>${yolda ? (o.durum === 'MONTAJ' ? 'Montaj ekibi yolda' : 'Ustan yolda') : o.duzeltme ? 'Düzeltme ziyareti planlandı' : o.durum === 'MONTAJ' ? 'Montaj randevun hazır' : 'Randevun hazır'}</h2><p class="buyuk-zaman">${ikon('takvim')}${zaman(o.slotTs)}</p>${kod}${sorun ? `<div class="btn-sira tek">${sorun}</div>` : ''}</section>`;
    }
    case 'BASLADI': {
      const n = s.kontrol.length, t = o.kontrol.length, st = o.stages && o.tip === 'proje' ? o.stages.find(a => !a.done) : null;
      return `<section class="kart eylem bekle"><h2>İş sürüyor</h2>${st ? `<p>Şu anki aşama: <b>${esc(st.ad)}</b></p>` : ''}
        <div class="ilerleme" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${t}"><i style="width:${Math.round(t / n * 100)}%"></i></div><p class="ipucu">${t}/${n} kontrol adımı tamam</p>${sorun ? `<div class="btn-sira tek">${sorun}</div>` : ''}</section>${ek}`;
    }
    case 'ASAMA_ONAY': {
      const i = o.stages.findIndex(a => a.done && !a.accepted), st = o.stages[i], nx = o.stages[i + 1];
      return `<section class="kart eylem"><h2>“${esc(st.ad)}” tamamlandı</h2><p>Kontrol et. Onaylarsan bu aşamanın bedeli (${tl(st.tutar)}) ustaya aktarılır${nx && !nx.paid ? ' ve “' + esc(nx.ad) + '” için ' + tl(nx.tutar) + ' kartından çekilir' : ''}.</p>${fotoGaleri(o.fotoSonra, 'Aşama fotoğrafı')}
        <div class="btn-sira">${sorun}<button class="btn" data-act="odeAc" data-tur="asama" data-id="${o.id}">Aşamayı onayla</button></div></section>`;
    }
    case 'URETIM': return `<section class="kart eylem bekle"><h2>Ürünün üretimde</h2><p>Atölye, onayladığın çizime göre üretiyor. Tahmini süre: ${esc(s.sure)}. Tamamlanınca sevk öncesi ödeme için haber vereceğiz.</p>${sorun ? `<div class="btn-sira tek">${sorun}</div>` : ''}</section>`;
    case 'SEVK_ODEME': return `<section class="kart eylem"><h2>Üretim tamamlandı</h2><p>Ürünün sevke hazır. Sevk öncesi ödemeyi yapınca nakliye ve montaj randevun planlanır.</p><button class="btn" data-act="odeAc" data-tur="sevk" data-id="${o.id}">Sevk ödemesini yap · ${tl(o.stages[1].tutar)}</button></section>`;
    case 'SEVK': return `<section class="kart eylem bekle"><h2>Sevke hazırlanıyor</h2><p>Ürün yola çıkınca montaj randevun burada görünecek.</p></section>`;
    case 'TESLIM': {
      const son = o.stages && !o.stages[o.stages.length - 1].paid ? o.stages[o.stages.length - 1].tutar : 0;
      return `<section class="kart eylem"><h2>${o.duzeltme ? 'Düzeltme tamamlandı' : 'İş tamamlandı'}</h2><p>Kontrol et; her şey yolundaysa onayla. ${zaman(o.acceptBy)} tarihine kadar yanıt vermezsen iş kendiliğinden kabul edilir; yasal hakların saklı kalır.</p>
        ${o.fotoOnce.length ? `<h3>Önce</h3>${fotoGaleri(o.fotoOnce, 'Önce')}` : ''}${o.fotoSonra.length ? `<h3>Sonra</h3>${fotoGaleri(o.fotoSonra, 'Sonra')}` : ''}
        <ul class="dahil">${s.kontrol.map((x, i) => `<li class="${o.kontrol.includes(i) ? '' : 'yok'}">${ikon(o.kontrol.includes(i) ? 'tik' : 'eksi')}${esc(x)}</li>`).join('')}</ul>
        ${son ? not('Onaylayınca son ödeme (' + tl(son) + ') kartından çekilir ve tamamı serbest bırakılır.') : ''}
        <button class="btn" data-act="sheet" data-ad="puan" data-id="${o.id}">Eline sağlık · Onayla</button><div class="btn-sira tek">${sorun}</div></section>`;
    }
    case 'KABUL': return `<section class="kart eylem tamam"><h2>Tamamlandı</h2><p>${o.otoKabul ? 'Süre dolduğu için iş kendiliğinden kabul edildi.' : 'Eline sağlık dedin; ödeme serbest bırakıldı.'} ${o.garantiBitis ? 'İşçilik garantin ' + tarih(o.garantiBitis) + ' tarihine kadar sürüyor.' : 'İlk 30 gün içinde kusur bildirebilirsin.'}</p>
      ${o.puan ? `<p class="puan-satir">${yildizlar(o.puan)}<span>Puanın</span></p>` : ''}${sorun ? `<div class="btn-sira tek">${sorun}</div>` : ''}</section>`;
    case 'IPTAL': return `<section class="kart eylem kapali"><h2>${o.iptal && o.iptal.sebep === 'musteriYok' ? 'Adreste bulunamadın' : 'Sipariş iptal edildi'}</h2>${satirlar([{ ad: 'Kesinti', tutar: o.iptal ? o.iptal.kesinti : 0 }, { ad: 'İade edilen', tutar: o.refunded }])}</section>`;
    case 'IADE': return `<section class="kart eylem kapali"><h2>Sipariş kapatıldı</h2><p>${o.refunded ? tl(o.refunded) + ' kartına iade edildi. Bankana göre 1–7 iş günü içinde hesabına geçer.' : 'Kartından çekim yapılmadı.'}</p></section>`;
  }
  return '';
}

G.siparis = p => {
  const o = bul(p.id); if (!o) return sayfaBas('Sipariş') + bos('Sipariş bulunamadı.');
  const s = hizmet(o.sid), u = ustaBul(o.ustaId), d = davaBul(o.disputeId), ip = iptalHesap(o);
  return sayfaBas(o.ad, o.code + ' · ' + TIP_AD[o.tip]) +
    `<div class="durum-satir">${durumCip(o, 'musteri')}<span>${esc(o.ilce)}, ${esc(o.il)}</span></div>` +
    musteriEylem(o, s, u) + (d ? davaKart(d, 'musteri') : '') + (u ? ustaKart(u, o) : '') + cetvel(o) + odemeOzet(o, 'musteri') +
    (o.ustaId && !kapaliMi(o) ? sohbet(o, 'musteri') : '') +
    `<section class="kart"><h2>Sipariş bilgisi</h2><dl class="kalemler bilgi"><div><dt>Adres</dt><dd>${esc(o.adres)}</dd></div>${o.not ? `<div><dt>Notun</dt><dd>${esc(o.not)}</dd></div>` : ''}</dl>${fotoGaleri(o.fotos, 'İş yeri')}</section>` +

    (ip.izin ? `<button class="btn metin tehlike" data-act="sheet" data-ad="iptal" data-id="${o.id}">Siparişi iptal et</button>` : ip.destek ? `<p class="dipnot">${esc(ip.neden)}</p>` : '');
};

SHEET.puan = (p, f) => {
  const o = bul(p.id), u = ustaBul(o.ustaId), son = o.stages && !o.stages[o.stages.length - 1].paid ? o.stages[o.stages.length - 1].tutar : 0, n = Number(f.puan) || 0;

    <div class="puanla" role="group" aria-label="Puan">${[1, 2, 3, 4, 5].map(i => `<button data-act="sec" data-k="puan" data-v="${i}" class="${i <= n ? 'dolu' : ''}" aria-label="${i} yıldız" aria-pressed="${i === n}">${ikon('yildiz')}</button>`).join('')}</div>
    ${not((son ? 'Son ödeme (' + tl(son) + ') kartından çekilir. ' : '') + 'Onayınla blokedeki ' + tl(blokede(o) + son) + ' serbest kalır; usta hakedişini 2 iş günü içinde alır. Garanti ve yasal hakların sürer.', 'kilit')}

SHEET.iptal = p => {
