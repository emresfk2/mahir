  return `<h2>Siparişi iptal et</h2><p class="sheet-metin">${esc(h.neden)}</p>${h.izin ? satirlar([{ ad: 'Kesinti', tutar: h.kesinti || 0 }, { ad: 'Sana iade', tutar: h.iade || 0 }]) : ''}
    <div class="btn-sira"><button class="btn ikincil" data-act="sheetKapat">Vazgeç</button>${h.izin ? `<button class="btn tehlike" data-act="iptalOnay" data-id="${o.id}">İptal et</button>` : ''}</div>`;
};

/* ---------- sorun bildir ---------- */
G.sikayet = (p, f) => {
  const o = bul(p.id); if (!o) return sayfaBas('Sorun bildir') + bos('Sipariş bulunamadı.');
  const turler = sikayetTurleri(o);
  if (!turler.length) return sayfaBas('Sorun bildir', o.ad) + bos('Bu sipariş için şu anda yeni bir bildirim açılamıyor.');
  const t = turler.find(x => x.id === f.tur);
  if (!t) return sayfaBas('Sorun bildir', o.ad + ' · ' + o.code) + `<p class="giris">Ne oldu? Seçimine göre en hızlı çözümü öneririz. Ödemen, karar çıkana kadar ustaya aktarılmaz.</p>
    <div class="secim-liste">${turler.map(x => `<button data-act="sec" data-k="tur" data-v="${x.id}"><span>${x.ad}</span><small>${x.ornek}</small></button>`).join('')}</div>`;
  const talep = t.talepler.length === 1 ? t.talepler[0] : f.talep, esik = kucukEsik(o);
  const tekrar = o.tip === 'proje' ? 'rötuş turu' : o.tip === 'mobilya' ? 'ayar ziyareti' : 'tekrar';
  const tutarAlan = `<label class="alan yan"><span>${t.id === 'hasar' ? 'Zararın tutarı' : t.id === 'fiyat' ? 'Fazladan istenen tutar' : 'İstediğin indirim'}</span><span class="birimli"><input type="number" inputmode="numeric" min="1" max="${indirimTavan(o)}" data-f="tutar" value="${esc(f.tutar || '')}"><i>₺</i></span></label><p class="ipucu">${tl(esik)} tutarına kadar olan talepler inceleme beklemeden karşılanır.</p>`;
  return sayfaBas(t.ad, o.ad + ' · ' + o.code) +
    (t.id === 'begenmeme' ? not(!o.memnuniyet ? 'Memnuniyet güvencesi: iş kurallara uygun olsa da bir kez ücretsiz ' + tekrar + ' hakkın var.' : o.tip === 'standart' || o.tip === 'acil' ? 'Ücretsiz tekrarı kullandın. Yine memnun değilsen işçilik bedeli iade edilir.' : 'Ücretsiz ' + tekrar + ' hakkını kullandın; talebini Mahir uzmanı değerlendirecek.') : '') +
    (t.acil ? not('Güvenlik bildirimi anında işleme alınır: iş durdurulur, usta askıya alınır, ödemen iade edilir. Tehlike sürüyorsa önce 112’yi ara.', 'uyari') : '') +
    `<section class="kart"><label class="alan"><span>Ne oldu?</span><textarea data-f="aciklama" rows="4" maxlength="600" placeholder="${esc(t.ornek)}">${esc(f.aciklama || '')}</textarea></label>
      <h3>Fotoğraf <i>karar süresini kısaltır</i></h3>${fotoAlan('f:fotos', f.fotos, 'Sorun')}</section>
    ${t.talepler.length > 1 ? `<section class="kart"><h2>Ne istiyorsun?</h2><div class="cipler">${t.talepler.map(x => cip('talep', x, TALEP_AD[x], f.talep)).join('')}</div>${talep === 'indirim' ? tutarAlan : ''}</section>` : talep === 'indirim' ? `<section class="kart">${tutarAlan}</section>` : ''}
    <p class="dipnot">Bu güvenceler, tüketici mevzuatından doğan haklarına ek olarak sunulur.</p>
    <div class="alt-cubuk"><button class="btn" data-act="sikayetGonder">Bildirimi gönder</button><button class="btn metin" data-act="sec" data-k="tur" data-v="">Başka bir sorun seç</button></div>`;
};

/* ---------- güvence ve hesap ---------- */
G.guvence = () => `<h1 class="baslik">Mahir güvencesi</h1><p class="giris">Sözleşmen ustayla değil Mahir’le. Bir şey ters giderse muhatabın biziz.</p>
  <div class="guvenceler">
    <section class="kart"><span class="rozet">${ikon('kilit')}</span><h2>Paran bloke kalır</h2><p>Kartından çekilen tutar, sen “Eline sağlık” diyene kadar ustaya geçmez. Proje işlerinde her aşama ayrı onaylanır.</p></section>
    <section class="kart"><span class="rozet">${ikon('yenile')}</span><h2>Memnuniyet güvencesi</h2><p>Sabit fiyatlı işlerde iş kurallara uygun olsa bile beğenmezsen 48 saat içinde bildir: bir kez ücretsiz tekrar, yine olmazsa işçilik iadesi. Yılda iki kez kullanılabilir.</p></section>
    <section class="kart"><span class="rozet">${ikon('kalkan')}</span><h2>İşçilik garantisi</h2><dl class="kalemler"><div><dt>Sabit fiyatlı iş</dt><dd>6 ay</dd></div><div><dt>Keşifli proje</dt><dd>12 ay</dd></div><div><dt>Ismarlama mobilya</dt><dd>24 ay</dd></div></dl></section>
    <section class="kart"><span class="rozet">${ikon('uyari')}</span><h2>Hasar ve gecikme</h2><p>Usta evine ya da eşyana zarar verirse 72 saat içinde bildir. Usta gelmezse yedek usta göndeririz; gönderemezsek siparişin %10’u kadar kredi ya da tam iade senin seçimin.</p></section>
    <section class="kart"><span class="rozet">${ikon('saat')}</span><h2>Şikâyet süreleri</h2><dl class="kalemler"><div><dt>İlk yanıt</dt><dd>2 saat</dd></div><div><dt>Güvenlik bildirimi</dt><dd>15 dakika</dd></div><div><dt>Karar</dt><dd>48 saat</dd></div><div><dt>Düzeltme hedefi</dt><dd>7 gün</dd></div></dl></section>
    <section class="kart"><span class="rozet">${ikon('takvim')}</span><h2>İptal koşulları</h2><dl class="kalemler uzun"><div><dt>Randevuya 24 saatten fazla var</dt><dd>Ücretsiz</dd></div><div><dt>Son 24 saat</dt><dd>%10 rezervasyon bedeli</dd></div><div><dt>Usta yola çıktı</dt><dd>${tl(ORAN.yolBedeli)} yol bedeli</dd></div><div><dt>Proje, iş başlamadan</dt><dd>Yerinde keşif bedeli hariç iade</dd></div><div><dt>Ismarlama ürün, üretim onayından sonra</dt><dd>Cayma hakkı yok</dd></div></dl></section>
  </div>
  ${not('Ustaya elden ödeme yapma, telefon numarası paylaşma. Mahir dışında yapılan iş ve ödemelerde hiçbir güvence geçerli olmaz.', 'uyari')}
  <p class="dipnot">Bu güvenceler, tüketici mevzuatından doğan yasal haklarına ek olarak sunulur.</p>`;

G.hesap = (p, f) => {
  if (f.adres == null) f.adres = S.adres;
  const bekleyen = S.waitlist.filter(w => w.ben);
  return `<h1 class="baslik">Hesap</h1>
  <section class="kart usta-kart"><span class="avatar">D</span><div><b>Demo müşteri</b><small>${esc(S.ilce)}, ${esc(S.il)}</small></div></section>
  <section class="kart"><h2>Adres</h2><label class="alan"><span>Açık adres</span><input type="text" data-f="adres" value="${esc(f.adres)}" maxlength="120"></label><button class="btn ikincil" data-act="adresKaydet">Kaydet</button></section>
  <section class="kart"><h2>Ödeme</h2><div class="kart-satir">${ikon('kart')}<div><b>Demo kartı</b><small>Kart bilgisi istenmez, gerçek ödeme alınmaz</small></div></div>
    <dl class="kalemler"><div><dt>Mahir kredisi</dt><dd>${tl(S.credit)}</dd></div><div><dt>Memnuniyet güvencesi kullanımı</dt><dd>${S.mg || 0} / 2</dd></div></dl></section>
  ${bekleyen.length ? `<section class="kart"><h2>Bekleme listem</h2><dl class="kalemler">${bekleyen.map(w => `<div><dt>${esc(w.ilce)}, ${esc(w.il)}</dt><dd>${esc((KATEGORILER.find(k => k.id === w.kat) || {}).ad)}</dd></div>`).join('')}</dl></section>` : ''}
  <section class="kart"><h2>Bu bir demo</h2><p>Gördüğün siparişler, ustalar ve fiyatlar örnektir. Yaptığın değişiklikler yalnızca bu tarayıcıda saklanır; gerçek ödeme alınmaz, kimseye bildirim gitmez.</p>
    <button class="btn ikincil" data-act="sheet" data-ad="onay" data-baslik="Örnek veri sıfırlansın mı?" data-metin="Verdiğin siparişler silinir, demo ilk haline döner." data-etiket="Sıfırla" data-eylem="sifirla" data-tehlike="1">Örnek veriyi sıfırla</button></section>
  <p class="dipnot marka-dip">${LOGO}<span>${MARKA.slogan}</span></p>`;
};

/* ===== Mahir · usta ekranları ===== */

function hakedisKutu(o) {
  const u = ustaBul(o.ustaId || (o.offer && o.offer.ustaId)), b = bol(o.kalem, u);
  if (o.durum === 'IPTAL' || o.durum === 'IADE') {
    const alinan = o.hakedis.reduce((t, h) => t + h.tutar, 0) + o.teminat + (o.teminatOdenen || 0);
    return `<section class="kart"><h2>Hakediş</h2>${satirlar([{ ad: 'Bu işten hakedişin', tutar: alinan }])}</section>`;
  }
  return `<section class="kart"><h2>Hakediş</h2>
    <dl class="kalemler"><div><dt>Bu işten hakedişin <small>KDV hariç</small></dt><dd>${tl(b.H)}</dd></div>
    <div><dt>Teminat <small>%${Math.round(b.tOran * 100)}, 30 gün</small></dt><dd>−${tl(b.teminat)}</dd></div>
    <div class="toplam"><dt>Kabulden 2 iş günü sonra</dt><dd>${tl(b.H - b.teminat)}</dd></div></dl>
    ${o.tip === 'acil' ? not('Acil işte hakediş, onaylanan ek işlerle birlikte artar; toplam, tavan fiyatı aşamaz.') : ''}
    ${o.tip === 'proje' ? not('Proje işlerinde hakediş, müşteri her aşamayı onayladıkça o aşamanın payı kadar serbest kalır.') : ''}
    ${o.duzeltme && topla(kalanKalem(o)) === 0 ? not('Garanti kapsamındaki düzeltme ziyareti için ek ödeme yapılmaz.') : ''}</section>`;
}

function kapsamMetni(o, s) {
  if (o.tip === 'standart') {
    const sec = s.secenekler ? (s.secenekler.find(x => x.id === o.opts.secenek) || s.secenekler[0]).ad : (o.opts.adet || 1) + ' ' + s.birim;
    return sec + (s.malzeme ? (o.opts.malzeme ? ' · malzemeyi Mahir gönderir (' + s.malzeme.ad + ')' : ' · malzeme müşteride') : '');
  }
  if (o.tip === 'acil') return 'Tanı ve ilk 30 dakika; ek iş müşteri onayıyla';
  if (o.tip === 'proje') return o.opts.m2 + ' ' + s.soru.birim + ' · ' + s.asamalar.length + ' aşama';
  return o.opts.en + ' × ' + o.opts.boy + ' × ' + o.opts.derinlik + ' cm · ' + (MALZEMELER.find(m => m.id === o.opts.malzeme) || MALZEMELER[0]).ad;
}

function isTeklifKart(o) {
  const s = hizmet(o.sid), kalan = Math.ceil((o.offer.bitis - Date.now()) / DK), b = ustaPayi(o);
  return `<section class="kart eylem"><div class="kart-ust"><h2>${esc(o.ad)}</h2><span class="cip cip-${kalan > 0 ? 'sen' : 'sorun'}">${kalan > 0 ? kalan + ' dk kaldı' : 'Süre doldu'}</span></div>
    <ul class="ozellik dik"><li>${ikon('pin')}${esc(o.ilce)}, ${esc(o.il)}</li><li>${ikon('takvim')}${o.tip === 'mobilya' && !o.montajda ? 'Üretim süresi: ' + esc(s.sure) : zaman(o.slotTs)}</li><li>${ikon('liste')}${TIP_AD[o.tip]}${o.duzeltme ? ' · düzeltme ziyareti' : ''}</li><li>${ikon('cuzdan')}Hakediş ${tl(b.H)} <small>KDV hariç</small></li></ul>
    ${o.not ? `<p class="alinti">${esc(o.not)}</p>` : ''}
    ${not('Açık adres ve müşteriyle mesajlaşma, işi kabul edince açılır.')}
    <div class="btn-sira"><button class="btn ikincil" data-act="uRet" data-id="${o.id}">Reddet</button><button class="btn" data-act="uKabul" data-id="${o.id}">Kabul et</button></div></section>`;
}

G.u_teklifler = () => {
  const u = ustaBul(S.ustaId);
  const teklifler = S.orders.filter(o => o.offer && o.offer.ustaId === u.id);
  const davalar = S.disputes.filter(d => d.ustaId === u.id && d.durum === 'ACIK');
  const aktif = S.orders.filter(o => o.ustaId === u.id && !kapaliMi(o));
  const biten = S.orders.filter(o => o.ustaId === u.id && kapaliMi(o)).slice(0, 6);
  return `<section class="kart usta-kart"><span class="avatar">${esc(u.ad.charAt(0))}</span><div><b>${esc(u.ad)}</b><small>${MESLEK_AD[u.meslek]} · ${u.seviye} usta</small>
      <small class="usta-olcu">${u.puan ? `${ikon('yildiz', 'dolu')} ${u.puan.toLocaleString('tr-TR')}` : 'Henüz puan yok'} · ${u.is} iş</small></div></section>
    ${u.aski ? not('Hesabın askıda. İnceleme bitene kadar yeni iş teklif edilmez; süren işlerin için operasyon seni arayacak.', 'uyari') : ''}
    ${davalar.map(d => `<button class="kart dikkat" data-act="git" data-ad="u_is" data-id="${d.oid}"><span class="rozet">${ikon('uyari')}</span><span class="sip-orta"><b>Şikâyete yanıt yaz</b><small>${esc(d.ad)} · ${d.code} · 24 saat içinde</small></span>${ikon('sag', 'ok')}</button>`).join('')}
    <h2 class="bolum">Yeni iş teklifleri</h2>
    ${teklifler.length ? teklifler.map(isTeklifKart).join('') : bos('Bekleyen teklif yok. Mahir, bölgene ve puanına göre işi sana kendisi gönderir; müşteri aramana gerek kalmaz.', 'canta')}
    <h2 class="bolum">İşlerim</h2>
    ${aktif.length ? `<div class="liste">${aktif.map(o => siparisKart(o, 'u_is', 'usta')).join('')}</div>` : bos('Süren işin yok.', 'takvim')}
    ${biten.length ? `<h2 class="bolum">Kapananlar</h2><div class="liste">${biten.map(o => siparisKart(o, 'u_is', 'usta')).join('')}</div>` : ''}`;
};

function ustaEylem(o, s, f) {
  const adres = `<p class="buyuk-zaman">${ikon('takvim')}${zaman(o.slotTs)}</p><p class="adres">${ikon('pin')}<span>${esc(o.adres)}<br>${esc(o.ilce)}, ${esc(o.il)}</span></p>`;
  switch (o.durum) {
    case 'ATAMA': return o.offer ? isTeklifKart(o) : '';
    case 'PLANLANDI': case 'MONTAJ': case 'YOLDA': {
      if (o.durum === 'YOLDA' || o.yolda) return `<section class="kart eylem"><h2>Kapıdasın</h2><p>Müşteriden uygulamasındaki 4 haneli kodu iste. Kod, adreste olduğunu ve işe başladığını doğrular.</p>
        <div class="kod-satir"><input class="kod-giris" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" data-f="kod" data-enter="uGiris" data-id="${o.id}" value="${esc(f.kod || '')}" placeholder="0000" aria-label="Kapı kodu"><button class="btn" data-act="uGiris" data-id="${o.id}">İşe başla</button></div>
        ${f.kodHata ? '<p class="hata" role="alert">Kod eşleşmedi. Müşteriden sipariş ekranındaki kodu yeniden iste.</p>' : ''}
        <p class="demo-ipucu"><b>DEMO</b><span>Kod müşteri ekranında görünür: <code>${o.kod}</code></span></p>
        ${o.durum === 'YOLDA' && !o.duzeltme && (o.tip === 'standart' || o.tip === 'acil') ? `<button class="btn metin" data-act="sheet" data-ad="onay" data-id="${o.id}" data-baslik="Müşteri adreste yok mu?" data-metin="20 dakika bekledikten ve operasyon müşteriyi iki kez aradıktan sonra iş kapatılır; yol bedeli (${tl(ORAN.yolBedeli)}) sana ödenir." data-etiket="İşi kapat" data-eylem="uMusteriYok" data-tehlike="1">Müşteri adreste yok</button>` : ''}</section>`;
      return `<section class="kart eylem"><h2>${o.duzeltme ? 'Düzeltme ziyareti' : o.durum === 'MONTAJ' ? 'Montaj randevusu' : 'Randevu'}</h2>${adres}
        <button class="btn" data-act="uYola" data-id="${o.id}">${ikon('kamyon')}Yola çıktım</button></section>`;
    }
    case 'BASLADI': {
      const proje = o.tip === 'proje', st = proje && o.stages ? o.stages.find(a => !a.done) : null, son = !proje || !st || o.stages.indexOf(st) === o.stages.length - 1;
      const bekleyen = o.extras.some(e => e.durum === 'bekliyor' || e.durum === 'uzman');
      const eksik = [];
      if (son && o.kontrol.length < s.kontrol.length) eksik.push('tüm kontrol adımlarını işaretle');
      if (!o.fotoSonra.length) eksik.push('en az bir “sonra” fotoğrafı ekle');
      if (bekleyen) eksik.push('ek iş talebinin yanıtlanmasını bekle');
      return `<section class="kart eylem"><h2>${st ? 'Aşama: ' + esc(st.ad) : o.duzeltme ? 'Düzeltme sürüyor' : 'İş sürüyor'}</h2>
        <ul class="kontrol">${s.kontrol.map((x, i) => `<li><button data-act="uKontrol" data-id="${o.id}" data-i="${i}" class="${o.kontrol.includes(i) ? 'sec' : ''}" aria-pressed="${o.kontrol.includes(i)}"><i>${ikon('tik')}</i><span>${esc(x)}</span></button></li>`).join('')}</ul>
        <h3>Önce</h3>${fotoAlan('o:fotoOnce', o.fotoOnce, 'Önce')}<h3>Sonra</h3>${fotoAlan('o:fotoSonra', o.fotoSonra, 'Sonra')}
        ${o.extras.length ? `<h3>Ek iş talepleri</h3><dl class="kalemler">${o.extras.map(e => `<div><dt>${esc(e.ad)} <small>${{ bekliyor: 'müşteri onayında', uzman: 'platform uzmanında', onay: 'onaylandı', ret: 'reddedildi' }[e.durum]}</small></dt><dd>${tl(e.tutar)}</dd></div>`).join('')}</dl>` : ''}
        <button class="btn" data-act="uTamam" data-id="${o.id}"${eksik.length ? ' disabled' : ''}>${st && !son ? 'Aşamayı tamamla' : 'İşi tamamla'}</button>
        ${eksik.length ? `<p class="ipucu">Tamamlamak için ${eksik.join(', ')}.</p>` : ''}
        <button class="btn ikincil" data-act="sheet" data-ad="ekIs" data-id="${o.id}">Ek iş gerekiyor</button></section>`;
    }
    case 'ASAMA_ONAY': return `<section class="kart eylem bekle"><h2>Müşteri onayı bekleniyor</h2><p>Müşteri aşamayı onaylayınca bu aşamanın hakedişi serbest kalır ve sonraki aşama başlar.</p></section>`;
    case 'URETIM': return `<section class="kart eylem"><h2>Üretim</h2><p>Onaylı çizim: ${o.opts.en} × ${o.opts.boy} × ${o.opts.derinlik} cm · ${esc((MALZEMELER.find(m => m.id === o.opts.malzeme) || MALZEMELER[0]).ad)} · numune ${esc(o.opts.numune)}.</p>
      <div class="cizim-kutu">${mobilyaCizim(s, o.opts)}</div><button class="btn" data-act="uUretim" data-id="${o.id}">Üretim tamamlandı</button></section>`;
    case 'SEVK_ODEME': return `<section class="kart eylem bekle"><h2>Sevk ödemesi bekleniyor</h2><p>Müşteri sevk öncesi ödemeyi yapınca ürünü yola çıkarabilirsin.</p></section>`;
    case 'SEVK': return `<section class="kart eylem"><h2>Sevke hazır</h2><p>Sevk öncesi ödeme alındı. Ürünü paketleyip yola çıkar; montaj randevusu müşteriye kendiliğinden bildirilir.</p><button class="btn" data-act="uSevk" data-id="${o.id}">${ikon('kamyon')}Ürünü sevk ettim</button></section>`;
    case 'TESLIM': return `<section class="kart eylem bekle"><h2>Müşteri kabulü bekleniyor</h2><p>Müşteri ${zaman(o.acceptBy)} tarihine kadar yanıt vermezse iş kendiliğinden kabul edilir.</p></section>`;
    case 'UYUSMAZLIK': return `<section class="kart eylem bekle"><h2>İş şikâyet nedeniyle durdu</h2><p>Karar çıkana kadar bu işin ödemesi blokede kalır.</p></section>`;
    case 'KABUL': return `<section class="kart eylem tamam"><h2>Kabul edildi</h2><p>${o.otoKabul ? 'Müşteri süresinde yanıt vermedi; iş kendiliğinden kabul edildi.' : 'Müşteri işi onayladı.'}</p>${o.puan ? `<p class="puan-satir">${yildizlar(o.puan)}<span>Müşteri puanı</span></p>` : ''}</section>`;
    default: return `<section class="kart eylem kapali"><h2>${DURUM[o.durum].ad}</h2><p>Bu iş kapandı.</p></section>`;
  }
}

G.u_is = (p, f) => {
  const o = bul(p.id); if (!o) return sayfaBas('İş') + bos('İş bulunamadı.');
  const benim = o.ustaId === S.ustaId || (o.offer && o.offer.ustaId === S.ustaId);
  if (!benim) return sayfaBas(o.ad, o.code) + bos('Bu iş başka bir ustada. Üstteki usta seçiciden değiştirebilirsin.', 'kisi');
  const s = hizmet(o.sid), d = davaBul(o.disputeId), atanmis = o.ustaId === S.ustaId;
  return sayfaBas(o.ad, o.code + ' · ' + TIP_AD[o.tip]) + `<div class="durum-satir">${durumCip(o, 'usta')}<span>${esc(o.ilce)}, ${esc(o.il)}</span></div>` +
    (d && d.durum === 'ACIK' && d.ustaId === S.ustaId ? davaKart(d, 'usta') + `<section class="kart eylem"><h2>Yanıtın</h2><p>24 saat içinde yanıt vermezsen karar yalnızca müşterinin anlattıklarına göre verilir.</p>
      <label class="alan"><span>Ne oldu, ne öneriyorsun?</span><textarea data-f="savunma" rows="4" maxlength="600">${esc(f.savunma || '')}</textarea></label><button class="btn" data-act="uSavunma" data-id="${d.id}">Yanıtı gönder</button></section>` : '') +
    ustaEylem(o, s, f) + (d && !(d.durum === 'ACIK' && d.ustaId === S.ustaId) ? davaKart(d, 'usta') : '') +
    (atanmis ? `<section class="kart"><h2>İş bilgisi</h2><dl class="kalemler bilgi"><div><dt>Adres</dt><dd>${esc(o.adres)}, ${esc(o.ilce)}</dd></div>${o.slotTs ? `<div><dt>Randevu</dt><dd>${zaman(o.slotTs)}</dd></div>` : ''}${o.not ? `<div><dt>Müşteri notu</dt><dd>${esc(o.not)}</dd></div>` : ''}
      <div><dt>Kapsam</dt><dd>${esc(kapsamMetni(o, s))}</dd></div></dl>${fotoGaleri(o.fotos, 'İş yeri')}</section>` : '') +
    hakedisKutu(o) + (atanmis && !kapaliMi(o) ? sohbet(o, 'usta') : '') + (atanmis ? izKart(o) : '');
};

SHEET.ekIs = (p, f) => {
  const o = bul(p.id), onceki = o.extras.filter(e => e.durum !== 'ret').reduce((t, e) => t + e.tutar, 0);
  const sinir = o.tip === 'acil' ? 'Bu işte en fazla ' + tl(o.fiyat.tavan - o.ilkToplam - onceki) + ' ek tutar girebilirsin (tavan fiyat).' : 'Ek işler toplamı ' + tl(Math.round(o.ilkToplam * ORAN.ekIsEsik)) + ' tutarını (ilk fiyatın %20’si) aşarsa önce platform uzmanı inceler.';
  return `<h2>Ek iş talebi</h2><p class="sheet-alt">Müşteri uygulamadan onaylamadan ek işe başlama; onaysız iş için ödeme yapılmaz.</p>
    <label class="alan"><span>Ne gerekiyor?</span><input type="text" data-f="ad" maxlength="120" value="${esc(f.ad || '')}" placeholder="Örn. ara musluk değişimi"></label>
    <label class="alan"><span>Ek tutar (₺, KDV dahil)</span><input type="number" inputmode="numeric" min="1" data-f="tutar" value="${esc(f.tutar || '')}"></label>
    <h3>Fotoğraf</h3>${fotoAlan('f:fotos', f.fotos, 'Ek iş')}
    ${not(sinir)}<button class="btn" data-act="uEkIs" data-id="${o.id}">Müşteri onayına gönder</button>`;
};

Object.assign(EYLEM, {
  uKabul: d => { const o = bul(d.id); ustaKabul(o); kaydet(); kokeGit('u_is', { id: o.id }); toast('İş senin. Müşteriye haber verildi'); },
  uRet: d => { ustaRet(bul(d.id)); kaydet(); if (V.ad === 'u_is') geri(); else ciz(); toast('Teklif reddedildi; iş sıradaki ustaya gitti'); },
  uYola: d => { yolaCik(bul(d.id)); degisti('Müşteriye “usta yolda” bildirimi gitti'); },
  uGiris: d => {
    const o = bul(d.id);
    if (giris(o, V.f.kod || '')) { V.f.kod = ''; V.f.kodHata = false; degisti('Kod doğrulandı, iş başladı'); }
    else { V.f.kodHata = true; ciz(); const el = $('.kod-giris'); if (el) el.focus(); }
  },
  uKontrol: d => { const o = bul(d.id), i = Number(d.i), k = o.kontrol.indexOf(i); if (k >= 0) o.kontrol.splice(k, 1); else o.kontrol.push(i); degisti(); },
  uTamam: d => { const o = bul(d.id); if (o.tip === 'proje') asamaTamam(o); else tamamla(o); degisti(o.durum === 'ASAMA_ONAY' ? 'Aşama müşteri onayına gönderildi' : 'İş teslim edildi; müşteri kabulü bekleniyor'); },
  uEkIs: d => {
    const o = bul(d.id), f = SH.f, r = ekIsTalep(o, { ad: f.ad, tutar: f.tutar, foto: (f.fotos || [])[0] });
    if (!r.ok) return toast(r.neden, 'hata');
    SH = null; degisti(r.uzman ? 'İlk fiyatın %20’sini aştı: önce platform uzmanı inceleyecek' : 'Ek iş müşteri onayına gönderildi');
  },
  uUretim: d => { uretimTamam(bul(d.id)); degisti('Müşteriden sevk öncesi ödeme istendi'); },
  uSevk: d => { sevkEt(bul(d.id)); degisti('Ürün yolda; montaj randevusu verildi'); },
  uSavunma: d => { if (!savunmaYaz(davaBul(d.id), V.f.savunma)) return toast('Yanıtını yaz.', 'hata'); V.f.savunma = ''; degisti('Yanıtın operasyona iletildi'); },
  uMusteriYok: d => { const o = bul(d.id), h = iptalEt(o, 'musteriYok'); SH = null; degisti(h.izin ? 'İş kapatıldı; yol bedeli hakedişine eklendi' : 'Bu iş buradan kapatılamaz; operasyonu ara', h.izin ? '' : 'hata'); },
});

G.u_kazanc = () => {
  const u = ustaBul(S.ustaId), isler = S.orders.filter(o => o.ustaId === u.id);
  let bekleyen = 0, odenen = 0, teminat = 0, beklenen = 0, rucu = 0; const satir = [];
  isler.forEach(o => {
    o.hakedis.forEach(h => { if (h.tutar <= 0) return; if (h.odendi) odenen += h.tutar; else bekleyen += h.tutar; satir.push({ o, h }); });
    teminat += o.teminat; odenen += o.teminatOdenen || 0; rucu += o.rucu || 0;
    if (!kapaliMi(o)) beklenen += bol(kalanKalem(o), u).H;
  });
  satir.sort((a, b) => b.h.at - a.h.at);
  const tem = isler.filter(o => o.teminat > 0);
  return `<h1 class="baslik">Kazanç</h1><p class="giris">Tutarlar KDV hariç hakedişindir. Ödemeyi müşteriden değil Mahir’den alırsın.</p>
    <div class="kpi"><div><small>Ödeme yolunda</small><b>${tl(bekleyen)}</b></div><div><small>Ödenen</small><b>${tl(odenen)}</b></div><div><small>Teminatta</small><b>${tl(teminat)}</b></div><div><small>Süren işlerden</small><b>${tl(beklenen)}</b></div></div>
    ${rucu ? not('Kusurlu bulunan işler nedeniyle ' + tl(rucu) + ' tutarında rücu borcun var; sonraki hakedişlerinden düşülür.', 'uyari') : ''}
    <section class="kart"><h2>Hakedişler</h2>${satir.length ? `<ul class="hareket">${satir.map(x => `<li><div><b>${esc(x.o.ad)}</b><small>${x.o.code} · ${x.h.odendi ? 'Ödendi · ' + gunAd(x.h.odemeAt) : 'Ödeme günü: ' + gunAd(x.h.vade)}</small></div><span class="para">${tl(x.h.tutar)}</span></li>`).join('')}</ul>` : '<p class="ipucu">Henüz serbest kalan hakediş yok.</p>'}</section>
    ${tem.length ? `<section class="kart"><h2>Teminatlar</h2><ul class="hareket">${tem.map(o => `<li><div><b>${esc(o.ad)}</b><small>${o.code} · ${tarih(o.teminatVade)} tarihinde serbest kalır</small></div><span class="para">${tl(o.teminat)}</span></li>`).join('')}</ul></section>` : ''}
    ${not('Hakediş, müşteri kabulünden 2 iş günü sonra hesabına geçer. Her işin %10’u (Uzman ustalarda %5) kusur ihtimaline karşı 30 gün teminatta tutulur.')}`;
};

G.u_profil = () => {
  const u = ustaBul(S.ustaId), i = SEVIYELER.indexOf(u.seviye);
  const sonraki = [`İlk 5 işini tamamla (${u.is}/5). Bu dönemde yalnızca sabit fiyatlı işler gelir ve ilk işlerin örneklemeyle denetlenir.`,
    `Uzman olmak için 50 iş (${u.is}/50), 5 üzerinden 4,7 puan ve %3’ün altında şikâyet oranı gerekir. Uzmanlarda teminat %5’e iner, proje işleri öncelikle onlara gider.`,
    'Eksper ustalar, uyuşmazlıklarda yerinde inceleme yapar ve ekspertiz ücreti alır. Operasyon davetiyle seçilir.', 'En üst seviyedesin.'][i];
  return `<h1 class="baslik">Profil</h1>
    <section class="kart usta-kart"><span class="avatar">${esc(u.ad.charAt(0))}</span><div><b>${esc(u.ad)}</b><small>${MESLEK_AD[u.meslek]}</small></div></section>
    <section class="kart"><h2>Seviye</h2><ol class="seviye">${SEVIYELER.map((x, k) => `<li class="${k < i ? 'gecti' : k === i ? 'simdi' : ''}"><b>${x}</b></li>`).join('')}</ol><p>${sonraki}</p></section>
    <div class="kpi"><div><small>Puan</small><b>${u.puan ? u.puan.toLocaleString('tr-TR') : '—'}</b></div><div><small>Tamamlanan iş</small><b>${u.is}</b></div><div><small>Kusurlu bulunan</small><b>${u.kusur || 0}</b></div><div><small>Ağır ihlal</small><b>${u.ihlal || 0} / 3</b></div></div>
    <section class="kart"><h2>Doğrulanan belgeler</h2><ul class="dahil">${u.belgeler.map(b => `<li>${ikon('tik')}${esc(b)}</li>`).join('')}</ul></section>
    <section class="kart"><h2>Mahir’de çalışmanın kuralları</h2><ul class="dahil">
      <li>${ikon('kilit')}Müşteriden elden para alma; ödeme yalnızca Mahir üzerinden.</li><li>${ikon('mesaj')}Telefon ve IBAN paylaşma; yazışma uygulamada kalır.</li>
      <li>${ikon('key')}Kapı kodunu girmeden işe başlama.</li><li>${ikon('kamera')}Önce ve sonra fotoğrafı çek; kusur tartışmasında seni korur.</li>
      <li>${ikon('arti')}Ek işi uygulamadan iste; onaysız iş ödenmez.</li><li>${ikon('uyari')}12 ayda 3 ağır ihlal (gelmeme, elden ödeme, güvenlik) ağdan çıkarılma nedenidir.</li></ul></section>`;
};

/* ===== Mahir · operasyon ekranları ===== */

function opsIsler() {
  const l = [];
  S.orders.forEach(o => {
    if (o.durum === 'TEKLIF_BEKLIYOR') l.push({ o, metin: 'Teklif hazırla', ad: 'o_teklif', id: o.id });
    if (o.durum === 'ATAMA' && o.atamaBekliyor) l.push({ o, metin: 'Uygun usta yok: elle ata', ad: 'o_siparis', id: o.id });
    if (o.durum === 'ATAMA' && o.offer && o.offer.bitis < Date.now()) l.push({ o, metin: 'Usta 30 dakikada yanıt vermedi', ad: 'o_siparis', id: o.id });
    o.extras.filter(e => e.durum === 'uzman').forEach(e => l.push({ o, metin: 'Ek iş incelemesi · ' + tl(e.tutar), ad: 'o_siparis', id: o.id }));
  });
  S.disputes.forEach(d => { if (d.durum === 'KARAR' || d.durum === 'ACIK') l.push({ o: bul(d.oid), metin: d.durum === 'KARAR' ? 'Şikâyet kararı bekliyor' : 'Şikâyet: usta yanıtı bekleniyor', ad: 'o_dava', id: d.id }); });
  return l;
}
const katAd = id => (KATEGORILER.find(k => k.id === id) || {}).ad || id;

G.o_ozet = () => {
  const b = bakiye(), isler = opsIsler();
  const kpi = [['Süren sipariş', S.orders.filter(o => !kapaliMi(o)).length], ['Açık şikâyet', S.disputes.filter(d => d.durum !== 'KAPANDI').length], ['Blokede', tl(b.bloke || 0)],
    ['Garanti fonu', tl(b.fon || 0)], ['Platform geliri', tl(b.gelir || 0)], ['Ustalara borç', tl((b.usta || 0) + (b.teminat || 0))]];
  const bek = {}; S.waitlist.forEach(w => { const a = w.ilce + ', ' + w.il + ' · ' + katAd(w.kat); bek[a] = (bek[a] || 0) + 1; });
  return `<h1 class="baslik">Operasyon özeti</h1>
    <div class="kpi alti">${kpi.map(k => `<div><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div>
    <h2 class="bolum">Senden iş bekleyenler</h2>

    <h2 class="bolum">Bekleme listesi</h2>
    <section class="kart">${Object.keys(bek).length ? `<dl class="kalemler">${Object.keys(bek).map(a => `<div><dt>${esc(a)}</dt><dd>${bek[a]} kişi</dd></div>`).join('')}</dl>` : '<p class="ipucu">Kapalı bölgelerden talep yok.</p>'}
      ${not('Bir ilçe-kategori, en az 3 aktif usta ve 24 saat içinde %90 atama oranıyla açılır. Ağ sekmesinden açıp kapatabilirsin.')}</section>`;
};

G.o_siparisler = (p, f) => {
  const sek = f.sek || 'aktif', liste = S.orders.filter(o => sek === 'tum' || (sek === 'aktif') === !kapaliMi(o));
  return `<h1 class="baslik">Siparişler</h1><div class="dilim">${cip('sek', 'aktif', 'Süren', sek)}${cip('sek', 'kapali', 'Kapanan', sek)}${cip('sek', 'tum', 'Tümü', sek)}</div>
    ${liste.length ? `<div class="liste">${liste.map(o => siparisKart(o, o.durum === 'TEKLIF_BEKLIYOR' ? 'o_teklif' : 'o_siparis', 'ops')).join('')}</div>` : bos('Bu listede sipariş yok.', 'liste')}`;
};

function defterSatir(k) {
  return `<li><div class="kayit-ust"><b>${esc(k.aciklama)}</b><time>${zaman(k.at)}</time></div><small>${k.code} · ${k.olay}</small>
    <dl class="kalemler mini">${k.lines.map(l => `<div><dt>${HESAP_AD[l.h] || l.h}</dt><dd class="${l.t < 0 ? 'eksi' : 'arti'}">${l.t < 0 ? '−' : '+'}${tl(Math.abs(l.t))}</dd></div>`).join('')}</dl></li>`;
}

G.o_siparis = p => {
  const o = bul(p.id); if (!o) return sayfaBas('Sipariş') + bos('Sipariş bulunamadı.');
  if (o.durum === 'TEKLIF_BEKLIYOR') return G.o_teklif(p, V.f);
  const s = hizmet(o.sid), u = ustaBul(o.ustaId), d = davaBul(o.disputeId), ip = iptalHesap(o);
  const kalan = kalanKalem(o), pay = bol(kalan, u || (o.offer && ustaBul(o.offer.ustaId)));
  const uzman = o.extras.filter(e => e.durum === 'uzman');
  const bekleyenHak = o.hakedis.some(h => !h.odendi && h.tutar > 0);
  let atama = '';
  if (o.durum === 'ATAMA') {
    const teklifli = o.offer ? ustaBul(o.offer.ustaId) : null, kalanDk = o.offer ? Math.ceil((o.offer.bitis - Date.now()) / DK) : 0;
    atama = `<section class="kart eylem${teklifli ? ' bekle' : ''}"><h2>Atama</h2>
      ${teklifli ? `<p>İş <b>${esc(teklifli.ad)}</b> için teklif edildi. ${kalanDk > 0 ? 'Yanıt için ' + kalanDk + ' dakikası var.' : 'Yanıt süresi doldu.'}</p><button class="btn ikincil" data-act="oAktar" data-id="${o.id}">Sıradaki ustaya aktar</button>` : '<p>Kendiliğinden atanabilecek usta kalmadı. Aşağıdan elle ata ya da siparişi iptal et.</p>'}
      <h3>Adaylar</h3>${adaylar(o).filter(a => !teklifli || a.id !== teklifli.id).map(a => `<div class="aday"><div><b>${esc(a.ad)}</b><small>${a.seviye} · ${a.puan ? a.puan.toLocaleString('tr-TR') + ' puan' : 'yeni'} · ${a.is} iş</small></div><button class="btn kucuk" data-act="oAta" data-id="${o.id}" data-usta="${a.id}">Teklif et</button></div>`).join('') || '<p class="ipucu">Bu meslekte uygun başka usta yok.</p>'}</section>`;
  }
  return sayfaBas(o.ad, o.code + ' · ' + TIP_AD[o.tip]) + `<div class="durum-satir">${durumCip(o, 'ops')}<span>${esc(o.ilce)}, ${esc(o.il)}</span></div>` + atama +
    uzman.map(e => `<section class="kart eylem"><h2>Ek iş incelemesi</h2><p>Usta <b>${esc(e.ad)}</b> için ${tl(e.tutar)} istedi. Ek işler toplamı ilk fiyatın (${tl(o.ilkToplam)}) %20’sini aşıyor; uygun bulursan müşteri onayına gider.</p>${e.foto ? fotoGaleri([e.foto], 'Ek iş') : ''}
      <div class="btn-sira"><button class="btn ikincil" data-act="oEkIs" data-id="${o.id}" data-ek="${e.id}" data-onay="">Uygun değil</button><button class="btn" data-act="oEkIs" data-id="${o.id}" data-ek="${e.id}" data-onay="1">Uygun</button></div></section>`).join('') +
    (d ? `<button class="kart dikkat" data-act="git" data-ad="o_dava" data-id="${d.id}"><span class="rozet">${ikon('uyari')}</span><span class="sip-orta"><b>Şikâyet · ${esc(TUR_AD(d.tur))}</b><small>${DAVA_DURUM[d.durum][0]}${d.karar ? ' · ' + esc(kararMetni(d)) : ''}</small></span>${ikon('sag', 'ok')}</button>` : '') +
    `<section class="kart"><h2>Para</h2><dl class="kalemler"><div><dt>Sipariş bedeli</dt><dd>${o.fiyat ? tl(o.fiyat.toplam) : '—'}</dd></div><div><dt>Tahsil edilen</dt><dd>${tl(o.paid)}</dd></div>${o.vade ? `<div><dt>Çekim zamanı</dt><dd>${zaman(o.vade)}</dd></div>` : ''}<div><dt>Blokede</dt><dd>${tl(blokede(o))}</dd></div><div><dt>Serbest bırakılan</dt><dd>${tl(o.rel)}</dd></div><div><dt>İade edilen</dt><dd>${tl(o.refunded)}</dd></div>${o.telafi ? `<div><dt>Fondan karşılanacak</dt><dd>${tl(o.telafi)}</dd></div>` : ''}${o.rucu ? `<div><dt>Ustadan rücu</dt><dd>${tl(o.rucu)}</dd></div>` : ''}</dl>
      ${topla(kalan) > 0 ? `<h3>Kalan ${tl(topla(kalan))} kabulde nasıl paylaşılır?</h3><dl class="kalemler mini"><div><dt>Usta hakedişi</dt><dd>${tl(pay.H - pay.teminat)}</dd></div><div><dt>Usta teminatı (30 gün)</dt><dd>${tl(pay.teminat)}</dd></div><div><dt>Tedarikçi</dt><dd>${tl(pay.M)}</dd></div><div><dt>Garanti fonu (%2)</dt><dd>${tl(pay.fon)}</dd></div><div><dt>Ödeme komisyonu (%2,5)</dt><dd>${tl(pay.odeme)}</dd></div><div><dt>KDV</dt><dd>${tl(pay.kdv)}</dd></div><div class="toplam"><dt>Platform geliri</dt><dd>${tl(pay.gelir)}</dd></div></dl>` : ''}</section>` +
    (u ? ustaKart(u, o) : '') +
    `<section class="kart"><h2>İşlemler</h2><div class="islemler">
      ${u && ['PLANLANDI', 'YOLDA', 'MONTAJ'].includes(o.durum) && (!o.duzeltme || o.rel === 0) ? `<button class="btn ikincil" data-act="sheet" data-ad="onay" data-id="${o.id}" data-baslik="Usta gelmedi olarak işaretle?" data-metin="${esc(u.ad)} için ağır ihlal yazılır, müşteriye sipariş bedelinin %10’u kadar kredi tanımlanır ve iş yedek ustaya teklif edilir." data-etiket="İşaretle" data-eylem="oGelmedi" data-tehlike="1">Usta gelmedi</button>` : ''}
      ${o.durum === 'TESLIM' ? `<button class="btn ikincil" data-act="oSure" data-id="${o.id}">Kabul süresini doldur <small>demo</small></button>` : ''}
      ${bekleyenHak && !acikDava(o) ? `<button class="btn ikincil" data-act="oHakedis" data-id="${o.id}">Hakedişi şimdi öde <small>demo</small></button>` : ''}
      ${ip.izin ? `<button class="btn ikincil tehlike" data-act="sheet" data-ad="onay" data-id="${o.id}" data-baslik="Sipariş iptal edilsin mi?" data-metin="${esc(ip.neden)} Kesinti ${tl(ip.kesinti || 0)}, iade ${tl(ip.iade || 0)}." data-etiket="İptal et" data-eylem="oIptal" data-tehlike="1">Siparişi iptal et</button>` : ''}
      <p class="ipucu">${kapaliMi(o) ? 'Sipariş kapandı.' : 'İş akışındaki olağan adımları müşteri ve usta atar; buradaki işlemler istisnalar içindir.'}</p></div></section>` +
    cetvel(o) +
    `<section class="kart"><h2>Sipariş bilgisi</h2><dl class="kalemler bilgi"><div><dt>Adres</dt><dd>${esc(o.adres)}</dd></div>${o.slotTs ? `<div><dt>Randevu</dt><dd>${zaman(o.slotTs)}</dd></div>` : ''}${o.not ? `<div><dt>Müşteri notu</dt><dd>${esc(o.not)}</dd></div>` : ''}<div><dt>Kapı kodu</dt><dd>${o.kod}</dd></div></dl>${fotoGaleri(o.fotos, 'İş yeri')}</section>` +
    (() => { const k = S.ledger.filter(x => x.oid === o.id); return k.length ? `<details class="kart iz"><summary><h2>Defter kayıtları</h2>${ikon('asagi')}</summary><ul class="defter">${k.map(defterSatir).join('')}</ul></details>` : ''; })() + izKart(o);
};

/* ---------- teklif hazırlama ---------- */
function teklifOnizle(o, s, f) {
  const fy = s.tip === 'proje' ? projeFiyat(s, { m2: f.m2 }, o.il, o.ilce) : mobilyaFiyat(s, Object.assign({}, o.opts, { en: f.en, boy: f.boy, derinlik: f.derinlik }), o.il, o.ilce);
  const pct = s.tip === 'proje' ? [30, 40, 30] : [40, 40, 20];
  return `<h2>Teklif</h2>${satirlar(fy.lines, fy.toplam)}<h3>Ödeme planı</h3><ul class="asamalar">${s.asamalar.map((ad, i) => `<li>${ikon('saat')}<span>${esc(ad)} <em>%${pct[i]}</em></span><b>${tl(yuvarla(fy.toplam * pct[i] / 100))}</b></li>`).join('')}</ul>
    ${o.onFiyat ? `<p class="ipucu">Müşteriye gösterilen ön tahmin: ${tl(yuvarla(o.onFiyat * 0.92))} – ${tl(yuvarla(o.onFiyat * 1.1))}</p>` : ''}`;
}
G.o_teklif = (p, f) => {
  const o = bul(p.id); if (!o) return sayfaBas('Teklif') + bos('Talep bulunamadı.');
  if (o.durum !== 'TEKLIF_BEKLIYOR') return G.o_siparis(p);
  const s = hizmet(o.sid);
  if (!f._hazir) { f._hazir = 1; if (s.tip === 'proje') f.m2 = o.opts.m2; else { f.en = o.opts.en; f.boy = o.opts.boy; f.derinlik = o.opts.derinlik; } }
  const sayi = (k, ad, min, max, birim) => `<label class="alan yan"><span>${ad}</span><span class="birimli"><input type="number" inputmode="numeric" data-f="${k}" data-canli="1" min="${min}" max="${max}" value="${esc(f[k])}"><i>${birim}</i></span></label>`;
  return sayfaBas('Teklif hazırla', o.ad + ' · ' + o.code) + `<div class="durum-satir">${durumCip(o, 'ops')}<span>${esc(o.ilce)}, ${esc(o.il)}</span></div>
    <section class="kart"><h2>Müşterinin talebi</h2><dl class="kalemler bilgi"><div><dt>Keşif</dt><dd>${o.kesif === 'yerinde' ? 'Yerinde · ' + tl(o.kesifBedeli) + ' alındı' : 'Görüntülü · ücretsiz'}</dd></div><div><dt>Adres</dt><dd>${esc(o.adres)}</dd></div>
      ${s.tip === 'proje' ? `<div><dt>Müşterinin tahmini</dt><dd>${o.opts.m2} ${s.soru.birim}</dd></div>` : `<div><dt>Müşterinin ölçüsü</dt><dd>${o.opts.en} × ${o.opts.boy} × ${o.opts.derinlik} cm</dd></div><div><dt>Malzeme</dt><dd>${esc((MALZEMELER.find(m => m.id === o.opts.malzeme) || MALZEMELER[0]).ad)}${s.kapakli ? ', ' + (o.opts.kapak === 'surgulu' ? 'sürgülü' : 'menteşeli') : ''} · ${esc(o.opts.numune)}</dd></div>`}
      ${o.not ? `<div><dt>Not</dt><dd>${esc(o.not)}</dd></div>` : ''}</dl>${fotoGaleri(o.fotos, 'İş yeri')}</section>
    <section class="kart"><h2>${s.tip === 'proje' ? 'Keşifte ölçülen' : 'Yerinde alınan ölçü'}</h2>
      ${s.tip === 'proje' ? sayi('m2', s.soru.ad, s.soru.min, s.soru.max, s.soru.birim) : sayi('en', 'Genişlik', s.olcu.en[0], s.olcu.en[1], 'cm') + sayi('boy', 'Yükseklik', s.olcu.boy[0], s.olcu.boy[1], 'cm') + sayi('derinlik', 'Derinlik', s.olcu.derinlik[0], s.olcu.derinlik[1], 'cm')}
      <p class="ipucu">Birim fiyatlar katalogdan ve ${esc(o.ilce)} bölge katsayısından gelir; usta fiyat veremez.</p></section>
    <section class="kart" id="canli-teklif">${teklifOnizle(o, s, f)}</section>
    <div class="alt-cubuk"><button class="btn" data-act="oTeklif" data-id="${o.id}">Teklifi müşteriye gönder</button></div>`;
};
CANLI.o_teklif = CANLI.o_siparis = (p, f) => { const o = bul(p.id), k = $('#canli-teklif'); if (o && k) k.innerHTML = teklifOnizle(o, hizmet(o.sid), f); };

/* ---------- şikâyetler ---------- */
G.o_davalar = () => `<h1 class="baslik">Şikâyetler</h1><p class="giris">Hedef: ilk yanıt 2 saat, usta yanıtı 24 saat, karar 48 saat.</p>
  ${S.disputes.length ? `<div class="liste">${S.disputes.map(d => { const dd = DAVA_DURUM[d.durum]; return `<button class="kart sip" data-act="git" data-ad="o_dava" data-id="${d.id}"><span class="rozet">${ikon('uyari')}</span><span class="sip-orta"><b>${esc(TUR_AD(d.tur))}</b><small>${esc(d.ad)} · ${d.code}</small><span class="sip-alt"><span class="cip cip-${dd[1]}">${dd[0]}</span><small>${zaman(d.at)}${d.oto ? ' · otomatik' : ''}</small></span></span></button>`; }).join('')}</div>` : bos('Şikâyet yok.', 'tik')}`;

G.o_dava = (p, f) => {
  const d = davaBul(p.id); if (!d) return sayfaBas('Şikâyet') + bos('Kayıt bulunamadı.');
  const o = bul(d.oid), t = SIKAYET_TURLERI.find(x => x.id === d.tur), u = ustaBul(d.ustaId), sonra = d.once === 'KABUL';
  let form = '';
  if (d.durum === 'ACIK' || d.durum === 'KARAR') {
    if (!f._hazir) { f._hazir = 1; f.sonuc = d.talep || 'duzeltme'; f.yuk = t.yuk; f.tutar = d.tutar || ''; f.not = ''; f.baska = false; }
    const azami = indirimTavan(o), kabulNotu = d.once === 'TESLIM' ? ' İş kabul edilmiş sayılır ve kalan ödeme serbest kalır.' : d.once === 'ASAMA_ONAY' ? ' Aşama onaylanmış sayılır ve sonraki aşama başlar.' : '';
    const etki = f.sonuc === 'ret' ? 'Şikâyet kapanır; iş kaldığı yerden devam eder.' + kabulNotu
      : f.sonuc === 'duzeltme' ? 'Müşteriden ücret alınmadan yeni ziyaret planlanır.' + (f.yuk === 'usta' ? ' Usta ek ödeme almaz.' : '')
      : (f.sonuc === 'iade' ? 'Müşteriye ' + tl(sonra ? azami : blokede(o)) + ' iade edilir ve sipariş kapanır. ' : 'Müşteriye girilen tutar iade edilir; henüz çekilmediyse çekilecek tutardan düşülür.' + kabulNotu + ' ') +
        (sonra ? (f.yuk === 'usta' ? 'Tutar önce ustanın teminatından (' + tl(o.teminat) + '), sonra bekleyen hakedişinden alınır; kalanı rücu yazılır. Ustadan alınacak tutar bu işin hakedişini aşamaz.' : 'Tutar garanti fonundan karşılanır.')
          : (f.yuk === 'usta' ? 'Para blokeden döner; ustanın hakedişi iade edilen tutar kadar küçülür.' : 'Para blokeden döner; ustanın hakedişi eksilmez, fark garanti fonundan karşılanır.'));
    form = `<section class="kart eylem"><h2>Karar</h2>${d.durum === 'ACIK' ? not('Usta henüz yanıt vermedi. 24 saat dolmadan karar verirsen yalnızca müşterinin anlattıklarına dayanırsın.', 'uyari') : ''}
      <h3>Sonuç</h3><div class="cipler">${['duzeltme', 'indirim', 'iade', 'ret'].map(x => cip('sonuc', x, x === 'ret' ? 'Reddet' : TALEP_AD[x], f.sonuc)).join('')}</div>
      ${f.sonuc === 'indirim' ? `<label class="alan yan"><span>İndirim tutarı</span><span class="birimli"><input type="number" inputmode="numeric" min="1" max="${azami}" data-f="tutar" value="${esc(f.tutar)}"><i>₺</i></span></label><p class="ipucu">En fazla ${tl(azami)}. Müşterinin talebi: ${d.tutar ? tl(d.tutar) : 'tutar belirtilmedi'}.</p>` : ''}
      ${f.sonuc === 'duzeltme' && o.rel === 0 && d.ustaId ? `<label class="onay"><input type="checkbox" data-f="baska" data-ciz="1"${f.baska ? ' checked' : ''}><span>Düzeltmeye başka usta gitsin (hakediş işi tamamlayan ustaya ödenir)</span></label>` : ''}
      ${f.sonuc !== 'ret' ? `<h3>Bedeli kim üstlenir?</h3><div class="cipler">${cip('yuk', 'usta', 'Usta kusuru', f.yuk)}${cip('yuk', 'platform', 'Platform üstlenir', f.yuk)}</div>` : ''}
      ${not(etki)}
      <label class="alan"><span>Müşteriye gidecek karar notu</span><textarea data-f="not" rows="3" maxlength="400">${esc(f.not)}</textarea></label>
      <button class="btn" data-act="oKarar" data-id="${d.id}">Kararı uygula</button></section>`;
  }
  const kayitlar = d.karar ? S.ledger.filter(x => x.oid === o.id && x.at >= d.at) : [];
  return sayfaBas('Şikâyet', d.ad + ' · ' + d.code) + davaKart(d, 'ops') + form +
    `<section class="kart"><h2>Dosya</h2><dl class="kalemler bilgi"><div><dt>Usta</dt><dd>${u ? esc(u.ad) + ' · ' + u.seviye + ' · ' + (u.kusur || 0) + ' kusurlu iş' : '—'}</dd></div><div><dt>Şikâyet anındaki durum</dt><dd>${DURUM[d.once].ad}</dd></div><div><dt>Sipariş bedeli</dt><dd>${tl(o.fiyat.toplam)}</dd></div><div><dt>Blokede</dt><dd>${tl(blokede(o))}</dd></div><div><dt>Kontrol listesi</dt><dd>${o.kontrol.length}/${hizmet(o.sid).kontrol.length}</dd></div><div><dt>Küçük tutar eşiği</dt><dd>${tl(kucukEsik(o))}</dd></div></dl>
      ${o.fotoOnce.length ? `<h3>Önce</h3>${fotoGaleri(o.fotoOnce, 'Önce')}` : ''}${o.fotoSonra.length ? `<h3>Sonra</h3>${fotoGaleri(o.fotoSonra, 'Sonra')}` : ''}
      <button class="btn ikincil" data-act="git" data-ad="o_siparis" data-id="${o.id}">Siparişi aç</button></section>` +
    (kayitlar.length ? `<section class="kart"><h2>Kararın deftere etkisi</h2><ul class="defter">${kayitlar.map(defterSatir).join('')}</ul></section>` : '');
};

/* ---------- ağ: ustalar ve bölgeler ---------- */
G.o_ag = (p, f) => {
  const sek = f.sek || 'ustalar';
  const ustalar = () => `<div class="liste">${S.ustalar.map(u => { const aktif = S.orders.filter(o => o.ustaId === u.id && !kapaliMi(o)).length; return `<section class="kart usta-satir"><span class="avatar">${esc(u.ad.charAt(0))}</span><div><b>${esc(u.ad)}</b><small>${MESLEK_AD[u.meslek]} · ${u.seviye}${u.aski ? ' · <em class="kirmizi">askıda</em>' : ''}</small><small>${u.puan ? u.puan.toLocaleString('tr-TR') + ' puan' : 'puan yok'} · ${u.is} iş · ${aktif} süren · ${u.kusur || 0} kusur · ${u.ihlal || 0}/3 ihlal</small></div>
    <button class="btn kucuk ikincil${u.aski ? '' : ' tehlike'}" data-act="oAski" data-id="${u.id}">${u.aski ? 'Askıyı kaldır' : 'Askıya al'}</button></section>`; }).join('')}</div>`;
  const bolgeler = () => `<p class="giris">Kategoriye dokunarak ilçede açıp kapatabilirsin. Kapalı kategoriyi seçen müşteri bekleme listesine yazılır.</p><div class="liste">${BOLGELER.map(b => { const acik = S.kapsam[kapsamAnahtar(b.il, b.ilce)] || []; return `<section class="kart"><div class="kart-ust"><h2>${esc(b.ilce)} <small>${esc(b.il)}</small></h2><span class="cip cip-bekle">katsayı ${b.k.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}${b.yol ? ' · yol ' + tl(b.yol) : ''}</span></div>
    <div class="cipler">${KATEGORILER.map(k => { const n = S.waitlist.filter(w => w.il === b.il && w.ilce === b.ilce && w.kat === k.id).length; return `<button class="cp${acik.includes(k.id) ? ' sec' : ''}" data-act="oKapsam" data-il="${esc(b.il)}" data-ilce="${esc(b.ilce)}" data-kat="${k.id}" aria-pressed="${acik.includes(k.id)}">${k.ad}${n ? ` <i class="sayi">${n}</i>` : ''}</button>`; }).join('')}</div></section>`; }).join('')}</div>`;
  return `<h1 class="baslik">Ağ</h1><div class="dilim">${cip('sek', 'ustalar', 'Ustalar', sek)}${cip('sek', 'bolgeler', 'Bölgeler', sek)}</div>${sek === 'ustalar' ? ustalar() : bolgeler()}`;
};

/* ---------- defter ---------- */
G.o_defter = () => {
  const b = bakiye(), sira = ['bloke', 'usta', 'teminat', 'tedarikci', 'fon', 'gelir', 'kdv', 'odeme', 'kredi', 'rucu'];
  const toplam = Object.keys(b).reduce((t, k) => t + b[k], 0);
  return `<h1 class="baslik">Defter</h1><p class="giris">Her hareket çift taraflı yazılır; bir kaydın satırları toplamı sıfırdır. Müşteri parası, kabul edilene kadar bloke hesapta durur.</p>
    <section class="kart"><h2>Hesap bakiyeleri</h2><dl class="kalemler">${sira.map(k => `<div><dt>${HESAP_AD[k]}</dt><dd>${(b[k] || 0) < 0 ? '−' : ''}${tl(Math.abs(b[k] || 0))}</dd></div>`).join('')}</dl>
      <h3>Karşı hesaplar</h3><dl class="kalemler">${['musteri', 'banka', 'sermaye'].map(k => `<div><dt>${HESAP_AD[k]}</dt><dd>${(b[k] || 0) < 0 ? '−' : ''}${tl(Math.abs(b[k] || 0))}</dd></div>`).join('')}<div class="toplam"><dt>Denge kontrolü</dt><dd>${toplam === 0 ? ikon('tik', 'ok-yesil') + ' 0' : tl(toplam)}</dd></div></dl></section>
    <section class="kart"><h2>Son hareketler</h2><ul class="defter">${S.ledger.slice(0, 40).map(defterSatir).join('')}</ul></section>`;
};

Object.assign(EYLEM, {
  oAta: d => { const o = bul(d.id); if (o.offer) { o.reddeden.push(o.offer.ustaId); } ata(o, d.usta); degisti('İş ' + ustaBul(d.usta).ad + ' için teklif edildi'); },
  oAktar: d => { ustaRet(bul(d.id), 'sure'); degisti('İş sıradaki ustaya aktarıldı'); },
  oGelmedi: d => { const kr = gelmedi(bul(d.id)); SH = null; degisti('Müşteriye ' + tl(kr) + ' kredi tanımlandı; yedek usta aranıyor'); },
  oEkIs: d => { ekIsUzman(bul(d.id), d.ek, !!d.onay); degisti(d.onay ? 'Ek iş müşteri onayına gönderildi' : 'Ek iş reddedildi'); },
  oSure: d => { const o = bul(d.id); o.acceptBy = Date.now() - 1; saatKontrol(); degisti('Süre doldu: iş kendiliğinden kabul edildi'); },
  oHakedis: d => { const t = hakedisOde(bul(d.id)); degisti(tl(t) + ' ustaya ödendi'); },
  oIptal: d => { const h = iptalEt(bul(d.id), 'ops'); SH = null; degisti(h.izin ? 'Sipariş iptal edildi' : h.neden, h.izin ? '' : 'hata'); },
  oTeklif: d => {
    const o = bul(d.id), s = hizmet(o.sid), f = V.f, sinir = (v, a) => Math.max(a[0], Math.min(a[1], Math.round(Number(v) || a[2])));
    teklifGonder(o, s.tip === 'proje' ? { m2: Number(f.m2) } : { en: sinir(f.en, s.olcu.en), boy: sinir(f.boy, s.olcu.boy), derinlik: sinir(f.derinlik, s.olcu.derinlik) });
    kaydet(); kokeGit('o_siparis', { id: o.id }); toast('Teklif müşteriye gönderildi');
  },
  oKarar: d => {
    const dv = davaBul(d.id), f = V.f;
    if (f.sonuc === 'indirim' && !(Number(f.tutar) > 0)) return toast('İndirim tutarını gir.', 'hata');
    kararUygula(dv, { sonuc: f.sonuc, yuk: f.sonuc === 'ret' ? 'usta' : f.yuk, tutar: f.tutar, baskaUsta: !!f.baska, not: String(f.not || '').trim() });
    V.f = {}; degisti('Karar uygulandı');
  },
  oAski: d => { const u = ustaBul(d.id); u.aski = !u.aski; degisti(u.aski ? u.ad + ' askıya alındı' : u.ad + ' yeniden aktif'); },
  oKapsam: d => { kapsamDegis(d.il, d.ilce, d.kat); degisti(); },
});

try { basla(); }
catch (e) {
  console.error(e);
  try { localStorage.removeItem(ANAHTAR); S = null; basla(); }
  catch (e2) { console.error(e2); document.getElementById('app').innerHTML = '<p style="padding:24px">Uygulama açılamadı. Sayfayı yenilemeyi dene.</p>'; }
}
</script>
